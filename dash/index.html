<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <title>jasonyen.me</title>

    <link rel="icon" type="image/png" href="/images/favicon.png" />

    <style>
      /* =========================================================
         GLOBAL
      ========================================================= */

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family:
          -apple-system,
          BlinkMacSystemFont,
          "SF Pro Display",
          "Segoe UI",
          sans-serif;
      }

      html {
        min-height: 100%;
        background: #050816;
        scroll-behavior: smooth;
      }

      body {
        min-height: 100vh;
        position: relative;
        isolation: isolate;
        background: #050816;
        color: white;
        overflow-x: hidden;
      }

      /* =========================================================
         CONTINUOUS BACKGROUND
      ========================================================= */

      body::before {
        content: "";
        position: fixed;
        inset: 0;
        z-index: -2;

        background:
          radial-gradient(
            circle at 0% 18%,
            rgba(127, 90, 240, 0.95),
            rgba(127, 90, 240, 0.55) 18%,
            transparent 38%
          ),
          radial-gradient(
            circle at 100% 82%,
            rgba(0, 194, 255, 0.55),
            transparent 36%
          ),
          linear-gradient(
            135deg,
            #050816 0%,
            #0b1022 50%,
            #0f172a 100%
          );

        background-repeat: no-repeat;
        background-size: cover;
      }

      /* =========================================================
         FLOATING ORBS
      ========================================================= */

      .orb {
        position: fixed;
        width: 420px;
        height: 420px;
        border-radius: 50%;
        filter: blur(60px);
        opacity: 0.35;
        pointer-events: none;
        z-index: -1;
        animation: float 14s ease-in-out infinite alternate;
      }

      .orb1 {
        top: -120px;
        left: -120px;
        background: #7f5af0;
      }

      .orb2 {
        width: 380px;
        height: 380px;
        bottom: -120px;
        right: -120px;
        background: #00c2ff;
        animation-duration: 18s;
      }

      @keyframes float {
        0% {
          transform: translate(0, 0) scale(1);
        }

        50% {
          transform: translate(40px, 30px) scale(1.05);
        }

        100% {
          transform: translate(-20px, 50px) scale(0.98);
        }
      }

      /* =========================================================
         NAVBAR
      ========================================================= */

      nav {
        width: 100%;
        padding: 24px 7%;

        display: flex;
        justify-content: space-between;
        align-items: center;

        position: fixed;
        top: 0;

        background: rgba(255, 255, 255, 0.05);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);

        border-bottom: 1px solid rgba(255, 255, 255, 0.08);

        z-index: 1000;
      }

      .logo {
        font-size: 1.5rem;
        font-weight: 700;
        letter-spacing: 1px;
        color: white;
        text-decoration: none;
      }

      .nav-links {
        display: flex;
        gap: 32px;
      }

      .nav-links a {
        text-decoration: none;
        color: rgba(255, 255, 255, 0.8);
        font-size: 0.95rem;
        transition: 0.3s;
      }

      .nav-links a:hover {
        color: white;
      }

      /* =========================================================
         MAIN GLASS CONTAINER
      ========================================================= */

      .chatbox {
        width: 90%;
        max-width: 1100px;

        margin: 120px auto 50px;
        padding: 60px;

        background: rgba(255, 255, 255, 0.08);

        backdrop-filter: blur(25px);
        -webkit-backdrop-filter: blur(25px);

        border-radius: 60px;

        border: 1px solid rgba(255, 255, 255, 0.12);

        box-shadow:
          0 8px 32px rgba(0, 0, 0, 0.35),
          inset 0 1px 1px rgba(255, 255, 255, 0.1);

        position: relative;
        z-index: 2;
      }

      /* =========================================================
         GAME HEADER
      ========================================================= */

      .game-header {
        margin-bottom: 24px;
      }

      .game-header h1 {
        font-size: 1.7rem;
        font-weight: 600;
        letter-spacing: -0.3px;
        margin-bottom: 10px;
      }

      .about-me {
        color: rgba(255, 255, 255, 0.72);
        font-size: 0.95rem;
        line-height: 1.6;
        max-width: 850px;
      }

      /* =========================================================
         GAME AREA
      ========================================================= */

      .game-area {
        width: 100%;
        margin-top: 28px;
      }

      canvas {
        width: 100%;
        max-width: 100%;
        height: 300px;

        display: block;

        border-radius: 24px;

        background: #0f1117;

        box-shadow:
          0 20px 60px rgba(0, 0, 0, 0.35),
          inset 0 1px rgba(255, 255, 255, 0.05);

        cursor: pointer;

        transition:
          box-shadow 0.3s ease,
          transform 0.15s ease;
      }

      canvas.gold-mode {
        box-shadow:
          0 0 20px rgba(255, 215, 0, 0.45),
          0 0 50px rgba(255, 215, 0, 0.35),
          0 0 90px rgba(255, 215, 0, 0.25);
      }

      /* =========================================================
         SCORE
      ========================================================= */

      .score-ui {
        margin-top: 18px;

        font-size: 0.95rem;
        font-weight: 600;

        color: rgba(255, 255, 255, 0.85);

        text-align: left;
      }

      /* =========================================================
         CODE BOX
      ========================================================= */

      .code-box {
        display: flex;
        align-items: center;
        gap: 12px;

        width: 100%;
        max-width: 440px;

        margin-top: 22px;
      }

      .code-box input {
        flex: 1;

        height: 48px;
        padding: 0 16px;

        border-radius: 16px;

        border: 1px solid rgba(255, 255, 255, 0.12);

        background: rgba(255, 255, 255, 0.06);

        color: white;

        font-family:
          -apple-system,
          BlinkMacSystemFont,
          "SF Pro Display",
          "Segoe UI",
          sans-serif;

        font-size: 0.9rem;

        outline: none;

        transition:
          border-color 0.25s ease,
          background 0.25s ease,
          box-shadow 0.25s ease;
      }

      .code-box input::placeholder {
        color: rgba(255, 255, 255, 0.4);
      }

      .code-box input:focus {
        border-color: rgba(127, 90, 240, 0.65);

        background: rgba(255, 255, 255, 0.08);

        box-shadow:
          0 0 0 4px rgba(127, 90, 240, 0.12),
          0 0 20px rgba(127, 90, 240, 0.18);
      }

      /* =========================================================
         BUTTON
      ========================================================= */

      .game-link,
      .code-box button {
        padding: 16px 28px;

        border-radius: 18px;

        background: rgba(255, 255, 255, 0.08);

        border: 1px solid rgba(255, 255, 255, 0.1);

        color: white;

        font-family:
          -apple-system,
          BlinkMacSystemFont,
          "SF Pro Display",
          "Segoe UI",
          sans-serif;

        font-weight: 600;

        cursor: pointer;

        transition: 0.35s;
      }

      .game-link:hover,
      .code-box button:hover {
        transform: translateY(-4px) scale(1.04);

        background: rgba(255, 255, 255, 0.15);

        box-shadow:
          0 15px 35px rgba(255, 255, 255, 0.12);
      }

      .code-box button {
        height: 48px;
        padding: 0 22px;
        white-space: nowrap;
      }

      .code-box button:active {
        transform: scale(0.97);
      }

      /* =========================================================
         BLACKOUT
      ========================================================= */

      .blackout {
        position: fixed;
        inset: 0;

        background: black;

        opacity: 0;

        pointer-events: none;

        transition: opacity 0.2s ease;

        z-index: 999999;
      }

      .blackout.active {
        opacity: 1;
      }

      /* =========================================================
         MOBILE
      ========================================================= */

      @media (max-width: 768px) {
        nav {
          padding: 20px 5%;
        }

        .nav-links {
          display: none;
        }

        .chatbox {
          margin-top: 110px;
          padding: 30px;
          border-radius: 35px;
        }

        .game-header h1 {
          font-size: 1.5rem;
        }

        .about-me {
          font-size: 0.9rem;
        }

        canvas {
          height: 300px;
          border-radius: 20px;
        }

        .code-box {
          flex-direction: column;
          max-width: none;
        }

        .code-box input,
        .code-box button {
          width: 100%;
        }
      }
    </style>
  </head>

  <body>
    <!-- Background -->
    <div class="orb orb1"></div>
    <div class="orb orb2"></div>

    <!-- Blackout -->
    <div class="blackout" id="blackout"></div>

    <!-- Navbar -->
    <nav>
      <a href="/" class="logo">Dash</a>

      <div class="nav-links">
        <a href="/">Main</a>
        <a href="/games">Games</a>
        <a href="/tools">Tools</a>
        <a href="/shuffler">Shuffler</a>
      </div>
    </nav>

    <!-- Main -->
    <main class="chatbox">
      <div class="game-header">

        <div class="about-me" id="aboutme">
          Press 3 to remove blackout for photosensitive viewers.
          Enter the code for extra dev tools.
        </div>
      </div>

      <div class="game-area">
        <canvas
          id="gameCanvas"
          width="800"
          height="300"
        ></canvas>

        <p id="score" class="score-ui">
          Score: 0 | Best: 0
        </p>

        <div class="code-box">
          <input
            type="password"
            id="secretCode"
            placeholder="Enter code..."
            autocomplete="off"
          />

          <button id="submitCode">
            Submit
          </button>
        </div>
      </div>
    </main>

    <!-- Music -->
    <audio id="bgMusic" loop preload="auto">
      <source src="./mp3/geodash.mp3" type="audio/mpeg" />
    </audio>

    <script>
      /* =========================================================
         MUSIC
      ========================================================= */

      const bgMusic = document.getElementById("bgMusic");

      function startMusic() {
        if (bgMusic.paused) {
          bgMusic.volume = 0.35;

          bgMusic.play().catch((err) => {
            console.log(err);
          });
        }
      }

      document.addEventListener("click", startMusic, {
        once: true,
      });

      document.addEventListener("keydown", startMusic, {
        once: true,
      });

      /* =========================================================
         GAME
      ========================================================= */

      window.addEventListener("load", () => {
        const canvas = document.getElementById("gameCanvas");

        if (!canvas) return;

        const ctx = canvas.getContext("2d");

        function resizeCanvas() {
          const width =
            canvas.parentElement.clientWidth || 800;

          canvas.width = width;
          canvas.height = 300;
        }

        window.addEventListener("resize", resizeCanvas);

        resizeCanvas();

        /* =====================================================
           GAME CONSTANTS
        ===================================================== */

        const GROUND_Y = 250;

        /* =====================================================
           PLAYER
        ===================================================== */

        let player = {
          x: 80,
          y: GROUND_Y - 30,
          size: 30,
          velocityY: 0,
          gravity: 1.3,
          jumpPower: -16.15,
          grounded: true,
          rotation: 0,
        };

        let jumpBuffer = 0;
        let coyoteTime = 0;

        /* =====================================================
           OBJECT ARRAYS
        ===================================================== */

        let obstacles = [];
        let rollingSpikes = [];
        let platforms = [];
        let stars = [];
        let spikePlatforms = [];
        let particles = [];
        let clouds = [];
        let floatingBlocks = [];
        let ballSpikes = [];

        let spawnTimer = 0;
        let nextSpawn = 90;

        /* =====================================================
           SCORE
        ===================================================== */

        let score = 0;
        let worldOffset = 0;

        let highScore =
          Number(localStorage.getItem("gd_highscore")) || 0;

        let gameOver = false;
        let invincible = false;
        let shakeTime = 0;

        let startTime = Date.now();

        /* =====================================================
           STARS
        ===================================================== */

        for (let i = 0; i < 80; i++) {
          stars.push({
            x: Math.random() * canvas.width,
            y: Math.random() * canvas.height,
            size: Math.random() * 2,
            speed: 0.2 + Math.random() * 0.5,
          });
        }

        /* =====================================================
           CLOUDS
        ===================================================== */

        for (let i = 0; i < 8; i++) {
          clouds.push({
            x: Math.random() * canvas.width,
            y: 40 + Math.random() * 100,
            width: 100 + Math.random() * 120,
            speed: 0.3 + Math.random() * 0.5,
          });
        }

        /* =====================================================
           SPAWN OBSTACLES
        ===================================================== */

        function spawnObstacle() {
          let furthestX = -Infinity;

          if (obstacles.length > 0) {
            furthestX = Math.max(
              furthestX,
              ...obstacles.map((o) => o.x + o.size)
            );
          }

          if (rollingSpikes.length > 0) {
            furthestX = Math.max(
              furthestX,
              ...rollingSpikes.map((r) => r.x + r.size)
            );
          }

          const SAFE_GAP = 140;

          if (canvas.width - furthestX < SAFE_GAP) {
            return;
          }

          const isRolling = Math.random() < 0.35;

          /* ===================================================
             ROLLING SPIKES
          =================================================== */

          if (isRolling) {
            rollingSpikes.push({
              x: canvas.width - 42,
              y: GROUND_Y,
              size: 34,
              rotation: 0,
            });

            rollingSpikes.push({
              x: canvas.width,
              y: GROUND_Y,
              size: 34,
              rotation: 0,
            });

            rollingSpikes.push({
              x: canvas.width + 42,
              y: GROUND_Y,
              size: 34,
              rotation: 0,
            });

            platforms.push({
              x: canvas.width - 5,
              y: GROUND_Y - 75,
              width: 45,
              height: 12,
            });

            return;
          }

          /* ===================================================
             BALL SPIKES
          =================================================== */

          if (Math.random() < 0.35) {
            const count =
              Math.floor(Math.random() * 2) + 1;

            for (let i = 0; i < count; i++) {
              ballSpikes.push({
                x: canvas.width + i * 46,
                y: GROUND_Y - 18,
                size: 36,
                rotation: 0,
                spinSpeed:
                  0.018 + Math.random() * 0.008,
              });
            }

            return;
          }

          /* ===================================================
             FLOOR PLATFORM
          =================================================== */

          if (Math.random() < 0.25) {
            const tileSize = 68;

            const length =
              Math.floor(Math.random() * 7) + 4;

            const platformY = GROUND_Y - 55;

            let spikes = [];

            const spikeCount =
              Math.floor(Math.random() * 3) + 1;

            const MIN_SAFE_BLOCKS = 5;

            for (let i = 0; i < spikeCount; i++) {
              const spikeIndex =
                Math.floor(
                  Math.random() *
                    (length - MIN_SAFE_BLOCKS)
                ) + MIN_SAFE_BLOCKS;

              spikes.push(spikeIndex);
            }

            spikePlatforms.push({
              x: canvas.width,
              y: platformY,
              width: length * tileSize,
              height: 14,
              spikes,
              tileSize,
            });

            return;
          }

          /* ===================================================
             NORMAL SPIKES
          =================================================== */

          const count =
            Math.floor(Math.random() * 3) + 1;

          for (let i = 0; i < count; i++) {
            obstacles.push({
              x: canvas.width + i * 34,
              y: GROUND_Y,
              size: 30,
            });

            if (Math.random() < 0.45) {
              floatingBlocks.push({
                x:
                  canvas.width +
                  Math.random() * 100,
                y:
                  80 +
                  Math.random() * 100,
                size:
                  25 +
                  Math.random() * 25,
                rotation: 0,
              });
            }
          }
        }

        /* =====================================================
           RESET
        ===================================================== */

        function resetGame() {
          obstacles = [];
          rollingSpikes = [];
          platforms = [];
          spikePlatforms = [];
          ballSpikes = [];
          particles = [];

          player.y = GROUND_Y - player.size;
          player.velocityY = 0;
          player.rotation = 0;
          player.grounded = true;

          score = 0;
          gameOver = false;

          startTime = Date.now();

          canvas.style.transform =
            "translate(0,0)";
        }

        /* =====================================================
           UPDATE
        ===================================================== */

        function update(deltaTime) {
          const GAME_SPEED = 13 * deltaTime;

          /* ---------------------------------------------------
             STARS
          --------------------------------------------------- */

          stars.forEach((s) => {
            s.x -= s.speed * deltaTime;

            if (s.x < 0) {
              s.x = canvas.width;
              s.y = Math.random() * canvas.height;
            }
          });

          /* ---------------------------------------------------
             CLOUDS
          --------------------------------------------------- */

          clouds.forEach((c) => {
            c.x -= c.speed * deltaTime;

            if (c.x + c.width < 0) {
              c.x = canvas.width + 100;
              c.y = 40 + Math.random() * 100;
            }
          });

          /* ---------------------------------------------------
             FLOATING BLOCKS
          --------------------------------------------------- */

          floatingBlocks.forEach((b) => {
            b.x -= GAME_SPEED * 0.7;
            b.rotation += 0.01 * deltaTime;
          });

          floatingBlocks =
            floatingBlocks.filter(
              (b) => b.x > -100
            );

          /* ---------------------------------------------------
             PARTICLES
          --------------------------------------------------- */

          if (!gameOver) {
            particles.push({
              x: player.x,
              y: player.y + player.size,
              size: 3 + Math.random() * 4,
              life: 25,
            });
          }

          particles.forEach((p) => {
            p.x -= 2;
            p.life--;
          });

          particles =
            particles.filter(
              (p) => p.life > 0
            );

          if (gameOver) return;

          worldOffset += 0.6 * deltaTime;
          spawnTimer += deltaTime;

          if (jumpBuffer > 0) {
            jumpBuffer -= deltaTime;
          }

          if (coyoteTime > 0) {
            coyoteTime -= deltaTime;
          }

          if (player.grounded) {
            coyoteTime = 8;
          }

          /* ---------------------------------------------------
             JUMP
          --------------------------------------------------- */

          if (
            jumpBuffer > 0 &&
            coyoteTime > 0
          ) {
            player.velocityY =
              player.jumpPower;

            player.grounded = false;

            jumpBuffer = 0;
            coyoteTime = 0;
          }

          /* ---------------------------------------------------
             GRAVITY
          --------------------------------------------------- */

          player.velocityY +=
            player.gravity * deltaTime;

          if (player.velocityY > 0) {
            player.velocityY +=
              0.9 * deltaTime;
          }

          player.y +=
            player.velocityY * deltaTime;

          /* ---------------------------------------------------
             SPAWN
          --------------------------------------------------- */

          if (spawnTimer >= nextSpawn) {
            spawnObstacle();

            spawnTimer = 0;

            nextSpawn =
              38 +
              Math.random() * 28;
          }

          /* ---------------------------------------------------
             ROTATION
          --------------------------------------------------- */

          if (!player.grounded) {
            player.rotation +=
              0.25 * deltaTime;
          } else {
            player.rotation = 0;
          }

          /* ---------------------------------------------------
             PLATFORMS
          --------------------------------------------------- */

          let onPlatform = false;

          platforms.forEach((p) => {
            const withinX =
              player.x + player.size > p.x &&
              player.x <
                p.x + p.width;

            const touchingTop =
              player.y + player.size >=
                p.y &&
              player.y + player.size <=
                p.y +
                  p.height +
                  8 &&
              player.velocityY >= 0;

            if (
              withinX &&
              touchingTop
            ) {
              player.y =
                p.y - player.size;

              player.velocityY = 0;
              player.grounded = true;
              onPlatform = true;
            }

            if (
              Math.abs(
                player.velocityY
              ) < 0.5
            ) {
              player.velocityY *= 0.95;
            }
          });

          /* ---------------------------------------------------
             GROUND
          --------------------------------------------------- */

          if (
            player.y >=
            GROUND_Y - player.size
          ) {
            player.y =
              GROUND_Y - player.size;

            player.velocityY = 0;
            player.grounded = true;
          } else if (!onPlatform) {
            player.grounded = false;
          }

          /* ---------------------------------------------------
             MOVE OBJECTS
          --------------------------------------------------- */

          platforms.forEach(
            (p) =>
              (p.x -= GAME_SPEED)
          );

          platforms =
            platforms.filter(
              (p) => p.x > -100
            );

          obstacles.forEach(
            (obs) =>
              (obs.x -= GAME_SPEED)
          );

          rollingSpikes.forEach((r) => {
            r.x -= GAME_SPEED;
            r.rotation +=
              0.18 * deltaTime;
          });

          rollingSpikes =
            rollingSpikes.filter(
              (r) => r.x > -60
            );

          ballSpikes.forEach((b) => {
            b.x -=
              GAME_SPEED * 0.88;

            b.rotation +=
              b.spinSpeed *
              deltaTime;
          });

          ballSpikes =
            ballSpikes.filter(
              (b) => b.x > -100
            );

          spikePlatforms.forEach(
            (p) =>
              (p.x -= GAME_SPEED)
          );

          spikePlatforms =
            spikePlatforms.filter(
              (p) =>
                p.x + p.width >
                -200
            );

          /* ===================================================
             NORMAL SPIKE COLLISION
          =================================================== */

          obstacles.forEach((obs) => {
            const paddingX = 8;
            const paddingTop = 12;
            const paddingBottom = 4;

            const spikeLeft =
              obs.x + paddingX;

            const spikeRight =
              obs.x +
              obs.size -
              paddingX;

            const spikeTop =
              obs.y -
              obs.size +
              paddingTop;

            const spikeBottom =
              obs.y -
              paddingBottom;

            const playerLeft =
              player.x + 4;

            const playerRight =
              player.x +
              player.size -
              4;

            const playerTop =
              player.y + 4;

            const playerBottom =
              player.y +
              player.size -
              4;

            const hit =
              playerRight >
                spikeLeft &&
              playerLeft <
                spikeRight &&
              playerBottom >
                spikeTop &&
              playerTop <
                spikeBottom;

            if (
              hit &&
              !invincible
            ) {
              gameOver = true;
              shakeTime = 20;

              saveHighScore();
            }
          });

          /* ===================================================
             ROLLING SPIKE COLLISION
          =================================================== */

          rollingSpikes.forEach(
            (r) => {
              const paddingX = 8;
              const paddingTop = 12;
              const paddingBottom = 4;

              const spikeLeft =
                r.x + paddingX;

              const spikeRight =
                r.x +
                r.size -
                paddingX;

              const spikeTop =
                r.y -
                r.size +
                paddingTop;

              const spikeBottom =
                r.y -
                paddingBottom;

              const playerLeft =
                player.x + 4;

              const playerRight =
                player.x +
                player.size -
                4;

              const playerTop =
                player.y + 4;

              const playerBottom =
                player.y +
                player.size -
                4;

              const hit =
                playerRight >
                  spikeLeft &&
                playerLeft <
                  spikeRight &&
                playerBottom >
                  spikeTop &&
                playerTop <
                  spikeBottom;

              if (
                hit &&
                !invincible
              ) {
                gameOver = true;
                shakeTime = 20;

                saveHighScore();
              }
            }
          );

          /* ===================================================
             SPIKE PLATFORMS
          =================================================== */

          spikePlatforms.forEach(
            (p) => {
              const withinX =
                player.x +
                  player.size >
                  p.x &&
                player.x <
                  p.x +
                    p.width;

              const touchingTop =
                player.y +
                  player.size >=
                  p.y &&
                player.y +
                  player.size <=
                  p.y +
                    p.height +
                    10 &&
                player.velocityY >=
                  0;

              if (
                withinX &&
                touchingTop
              ) {
                player.y =
                  p.y -
                  player.size;

                player.velocityY = 0;
                player.grounded = true;
              }

              /* Bottom spikes */

              for (
                let i = 0;
                i < p.width;
                i += 34
              ) {
                const spikeX =
                  p.x + i;

                const spikeLeft =
                  spikeX + 6;

                const spikeRight =
                  spikeX + 28;

                const spikeTop =
                  p.y +
                  p.height;

                const spikeBottom =
                  p.y +
                  p.height +
                  26;

                const playerLeft =
                  player.x + 4;

                const playerRight =
                  player.x +
                  player.size -
                  4;

                const playerTop =
                  player.y + 4;

                const playerBottom =
                  player.y +
                  player.size -
                  4;

                const hit =
                  playerRight >
                    spikeLeft &&
                  playerLeft <
                    spikeRight &&
                  playerBottom >
                    spikeTop &&
                  playerTop <
                    spikeBottom;

                if (
                  hit &&
                  !invincible
                ) {
                  gameOver = true;
                  shakeTime = 20;

                  saveHighScore();
                }
              }

              /* Top spikes */

              p.spikes.forEach(
                (index) => {
                  const spikeX =
                    p.x +
                    index * 34;

                  const spikeLeft =
                    spikeX + 6;

                  const spikeRight =
                    spikeX + 28;

                  const spikeTop =
                    p.y - 28;

                  const spikeBottom =
                    p.y;

                  const playerLeft =
                    player.x + 4;

                  const playerRight =
                    player.x +
                    player.size -
                    4;

                  const playerTop =
                    player.y + 4;

                  const playerBottom =
                    player.y +
                    player.size -
                    4;

                  const hit =
                    playerRight >
                      spikeLeft &&
                    playerLeft <
                      spikeRight &&
                    playerBottom >
                      spikeTop &&
                    playerTop <
                      spikeBottom;

                  if (
                    hit &&
                    !invincible
                  ) {
                    gameOver = true;
                    shakeTime = 20;

                    saveHighScore();
                  }
                }
              );
            }
          );

          obstacles =
            obstacles.filter(
              (obs) =>
                obs.x > -50
            );

          /* ===================================================
             SCORE
          =================================================== */

          score = Math.floor(
            (Date.now() -
              startTime) /
              1000
          );

          saveHighScore();

          document.getElementById(
            "score"
          ).textContent =
            "Score: " +
            score +
            " | Best: " +
            highScore;
        }

        /* =====================================================
           HIGH SCORE
        ===================================================== */

        function saveHighScore() {
          if (score > highScore) {
            highScore = score;

            localStorage.setItem(
              "gd_highscore",
              highScore
            );
          }
        }

        /* =====================================================
           DRAW
        ===================================================== */

        function draw() {
          ctx.clearRect(
            0,
            0,
            canvas.width,
            canvas.height
          );

          /* ---------------------------------------------------
             BACKGROUND
          --------------------------------------------------- */

          const bg =
            ctx.createLinearGradient(
              0,
              0,
              0,
              canvas.height
            );

          bg.addColorStop(
            0,
            "#1a1f3a"
          );

          bg.addColorStop(
            1,
            "#0f1117"
          );

          ctx.fillStyle = bg;

          ctx.fillRect(
            0,
            0,
            canvas.width,
            canvas.height
          );

          /* ---------------------------------------------------
             MOUNTAINS
          --------------------------------------------------- */

          ctx.fillStyle =
            "rgba(21,25,43,0.75)";

          for (
            let i = 0;
            i < 12;
            i++
          ) {
            const x =
              i * 120 -
              (worldOffset % 120);

            ctx.beginPath();

            ctx.moveTo(
              x,
              GROUND_Y
            );

            ctx.lineTo(
              x + 60,
              GROUND_Y - 90
            );

            ctx.lineTo(
              x + 120,
              GROUND_Y
            );

            ctx.closePath();

            ctx.fill();
          }

          /* ---------------------------------------------------
             CLOUDS
          --------------------------------------------------- */

          ctx.fillStyle =
            "rgba(255,255,255,0.08)";

          clouds.forEach((c) => {
            ctx.beginPath();

            ctx.roundRect(
              c.x,
              c.y,
              c.width,
              35,
              20
            );

            ctx.fill();
          });

          /* ---------------------------------------------------
             GRID
          --------------------------------------------------- */

          ctx.strokeStyle =
            "rgba(255,255,255,0.05)";

          ctx.lineWidth = 1;

          for (
            let x = 0;
            x < canvas.width;
            x += 40
          ) {
            ctx.beginPath();

            ctx.moveTo(x, 0);
            ctx.lineTo(
              x,
              canvas.height
            );

            ctx.stroke();
          }

          for (
            let y = 0;
            y < canvas.height;
            y += 40
          ) {
            ctx.beginPath();

            ctx.moveTo(0, y);
            ctx.lineTo(
              canvas.width,
              y
            );

            ctx.stroke();
          }

          /* ---------------------------------------------------
             STARS
          --------------------------------------------------- */

          ctx.fillStyle = "white";

          stars.forEach((s) => {
            ctx.globalAlpha = 0.7;

            ctx.beginPath();

            ctx.arc(
              s.x,
              s.y,
              s.size,
              0,
              Math.PI * 2
            );

            ctx.fill();
          });

          ctx.globalAlpha = 1;

          /* ---------------------------------------------------
             GROUND
          --------------------------------------------------- */

          ctx.shadowBlur = 15;
          ctx.shadowColor = "#536dfe";

          ctx.fillStyle = "#536dfe";

          ctx.fillRect(
            0,
            GROUND_Y,
            canvas.width,
            4
          );

          ctx.shadowBlur = 0;

          /* ---------------------------------------------------
             FLOATING BLOCKS
          --------------------------------------------------- */

          floatingBlocks.forEach(
            (b) => {
              ctx.save();

              ctx.translate(
                b.x,
                b.y
              );

              ctx.rotate(
                b.rotation
              );

              ctx.fillStyle =
                "#8e99f3";

              ctx.shadowBlur = 15;
              ctx.shadowColor =
                "#8e99f3";

              ctx.fillRect(
                -b.size / 2,
                -b.size / 2,
                b.size,
                b.size
              );

              ctx.restore();
            }
          );

          ctx.shadowBlur = 0;

          /* ---------------------------------------------------
             PLATFORMS
          --------------------------------------------------- */

          ctx.shadowBlur = 15;
          ctx.shadowColor = "#00ff88";

          ctx.fillStyle = "#00ff88";

          platforms.forEach((p) => {
            ctx.fillRect(
              p.x,
              p.y,
              p.width,
              p.height
            );
          });

          ctx.shadowBlur = 0;

          /* ---------------------------------------------------
             PLAYER
          --------------------------------------------------- */

          ctx.save();

          ctx.translate(
            player.x +
              player.size / 2,
            player.y +
              player.size / 2
          );

          ctx.rotate(
            player.rotation
          );

          ctx.shadowBlur = 20;

          ctx.shadowColor =
            invincible
              ? "#ffd700"
              : "#00e5ff";

          ctx.fillStyle =
            invincible
              ? "#ffd700"
              : "#00e5ff";

          ctx.fillRect(
            -player.size / 2,
            -player.size / 2,
            player.size,
            player.size
          );

          ctx.restore();

          ctx.shadowBlur = 0;

          /* ---------------------------------------------------
             ROLLING SPIKES
          --------------------------------------------------- */

          rollingSpikes.forEach(
            (r) => {
              ctx.save();

              ctx.translate(
                r.x +
                  r.size / 2,
                r.y -
                  r.size / 2
              );

              ctx.rotate(
                r.rotation
              );

              ctx.shadowBlur = 18;
              ctx.shadowColor =
                "#ff1744";

              ctx.fillStyle =
                "#ff1744";

              ctx.beginPath();

              ctx.moveTo(
                -r.size / 2,
                r.size / 2
              );

              ctx.lineTo(
                0,
                -r.size / 2
              );

              ctx.lineTo(
                r.size / 2,
                r.size / 2
              );

              ctx.closePath();

              ctx.fill();

              ctx.strokeStyle =
                "#ffffff";

              ctx.lineWidth = 2;

              ctx.beginPath();

              ctx.moveTo(-8, 6);
              ctx.lineTo(0, -10);
              ctx.lineTo(8, 6);

              ctx.stroke();

              ctx.restore();
            }
          );

          ctx.shadowBlur = 0;

          /* ---------------------------------------------------
             SPIKE PLATFORMS
          --------------------------------------------------- */

          spikePlatforms.forEach(
            (p) => {
              ctx.shadowBlur = 15;
              ctx.shadowColor =
                "#00ff88";

              ctx.fillStyle =
                "#00ff88";

              ctx.fillRect(
                p.x,
                p.y,
                p.width,
                p.height
              );

              /* Bottom spike */

              ctx.save();

              ctx.translate(
                p.x + 17,
                p.y +
                  p.height +
                  15
              );

              ctx.shadowBlur = 18;
              ctx.shadowColor =
                "#ff1744";

              ctx.fillStyle =
                "#ff1744";

              ctx.beginPath();

              ctx.moveTo(-17, -15);
              ctx.lineTo(0, 15);
              ctx.lineTo(17, -15);

              ctx.closePath();

              ctx.fill();

              ctx.strokeStyle =
                "#ffffff";

              ctx.lineWidth = 2;

              ctx.beginPath();

              ctx.moveTo(-8, -6);
              ctx.lineTo(0, 10);
              ctx.lineTo(8, -6);

              ctx.stroke();

              ctx.restore();

              /* Platform details */

              ctx.fillStyle =
                "rgba(255,255,255,0.18)";

              for (
                let i = 0;
                i < p.width;
                i += 34
              ) {
                ctx.fillRect(
                  p.x + i + 4,
                  p.y + 3,
                  24,
                  3
                );
              }

              /* Top spikes */

              ctx.fillStyle =
                "#ff1744";

              ctx.shadowColor =
                "#ff1744";

              p.spikes.forEach(
                (index) => {
                  const spikeX =
                    p.x +
                    index * 34;

                  ctx.beginPath();

                  ctx.moveTo(
                    spikeX,
                    p.y
                  );

                  ctx.lineTo(
                    spikeX + 17,
                    p.y - 30
                  );

                  ctx.lineTo(
                    spikeX + 34,
                    p.y
                  );

                  ctx.closePath();

                  ctx.fill();

                  ctx.strokeStyle =
                    "#ffffff";

                  ctx.lineWidth = 2;

                  ctx.beginPath();

                  ctx.moveTo(
                    spikeX + 9,
                    p.y - 6
                  );

                  ctx.lineTo(
                    spikeX + 17,
                    p.y - 20
                  );

                  ctx.lineTo(
                    spikeX + 25,
                    p.y - 6
                  );

                  ctx.stroke();
                }
              );

              ctx.shadowBlur = 0;
            }
          );

          /* ---------------------------------------------------
             NORMAL SPIKES
          --------------------------------------------------- */

          obstacles.forEach((obs) => {
            ctx.save();

            ctx.translate(
              obs.x +
                obs.size / 2,
              obs.y -
                obs.size / 2
            );

            ctx.shadowBlur = 18;
            ctx.shadowColor =
              "#ff1744";

            ctx.fillStyle =
              "#ff1744";

            ctx.beginPath();

            ctx.moveTo(
              -obs.size / 2,
              obs.size / 2
            );

            ctx.lineTo(
              0,
              -obs.size / 2
            );

            ctx.lineTo(
              obs.size / 2,
              obs.size / 2
            );

            ctx.closePath();

            ctx.fill();

            ctx.strokeStyle =
              "#ffffff";

            ctx.lineWidth = 2;

            ctx.beginPath();

            ctx.moveTo(-8, 6);
            ctx.lineTo(0, -10);
            ctx.lineTo(8, 6);

            ctx.stroke();

            ctx.restore();
          });

          ctx.shadowBlur = 0;

          /* ---------------------------------------------------
             BALL SPIKES
          --------------------------------------------------- */

          ballSpikes.forEach((b) => {
            ctx.save();

            ctx.translate(
              b.x +
                b.size / 2,
              b.y
            );

            ctx.rotate(
              b.rotation
            );

            ctx.shadowBlur = 20;
            ctx.shadowColor =
              "#ff1744";

            const spikes = 14;

            const outerR =
              b.size / 2;

            const innerR =
              b.size / 3;

            ctx.beginPath();

            for (
              let i = 0;
              i < spikes * 2;
              i++
            ) {
              const angle =
                (Math.PI / spikes) *
                i;

              const r =
                i % 2 === 0
                  ? outerR
                  : innerR;

              const x =
                Math.cos(angle) * r;

              const y =
                Math.sin(angle) * r;

              if (i === 0) {
                ctx.moveTo(x, y);
              } else {
                ctx.lineTo(x, y);
              }
            }

            ctx.closePath();

            ctx.fillStyle =
              "#c0c0c0";

            ctx.fill();

            ctx.beginPath();

            ctx.arc(
              0,
              0,
              outerR * 0.25,
              0,
              Math.PI * 2
            );

            ctx.fillStyle =
              "#ff1744";

            ctx.fill();

            ctx.restore();
          });

          /* ---------------------------------------------------
             BALL COLLISION
          --------------------------------------------------- */

          ballSpikes.forEach((b) => {
            const centerX =
              b.x +
              b.size / 2;

            const centerY =
              b.y;

            const radius =
              b.size / 2 - 6;

            const playerCenterX =
              player.x +
              player.size / 2;

            const playerCenterY =
              player.y +
              player.size / 2;

            const dx =
              playerCenterX -
              centerX;

            const dy =
              playerCenterY -
              centerY;

            const distance =
              Math.sqrt(
                dx * dx +
                  dy * dy
              );

            if (
              distance <
                radius +
                  player.size /
                    2 -
                  4 &&
              !invincible
            ) {
              gameOver = true;
              shakeTime = 20;

              saveHighScore();
            }
          });

          /* ---------------------------------------------------
             PARTICLES
          --------------------------------------------------- */

          particles.forEach((p) => {
            ctx.globalAlpha =
              p.life / 25;

            ctx.fillStyle =
              "#00e5ff";

            ctx.fillRect(
              p.x,
              p.y,
              p.size,
              p.size
            );
          });

          ctx.globalAlpha = 1;

          /* ---------------------------------------------------
             GAME OVER
          --------------------------------------------------- */

          if (gameOver) {
            ctx.fillStyle =
              "rgba(0,0,0,0.45)";

            ctx.fillRect(
              0,
              0,
              canvas.width,
              canvas.height
            );

            if (shakeTime > 0) {
              canvas.style.transform =
                `translate(${
                  Math.floor(
                    Math.random() *
                      8 -
                      4
                  )
                }px, ${
                  Math.floor(
                    Math.random() *
                      8 -
                      4
                  )
                }px)`;

              shakeTime--;
            } else {
              canvas.style.transform =
                "translate(0,0)";
            }

            ctx.fillStyle =
              "white";

            ctx.textAlign =
              "center";

            ctx.font =
              "700 32px -apple-system, BlinkMacSystemFont, \"SF Pro Display\", \"Segoe UI\", sans-serif";

            ctx.fillText(
              "Game Over",
              canvas.width / 2,
              120
            );

            ctx.font =
              "18px -apple-system, BlinkMacSystemFont, \"SF Pro Display\", \"Segoe UI\", sans-serif";

            ctx.fillText(
              "Click to Restart",
              canvas.width / 2,
              155
            );

            ctx.textAlign =
              "left";
          } else {
            canvas.style.transform =
              "translate(0,0)";
          }
        }

        /* =====================================================
           GAME LOOP
        ===================================================== */

        let lastTime = 0;

        function loop(timestamp) {
          if (!lastTime) {
            lastTime = timestamp;
          }

          const deltaTime =
            Math.min(
              (timestamp -
                lastTime) /
                16.67,
              2
            );

          lastTime = timestamp;

          update(deltaTime);
          draw();

          requestAnimationFrame(
            loop
          );
        }

        requestAnimationFrame(loop);

        /* =====================================================
           KEYBOARD CONTROLS
        ===================================================== */

        document.addEventListener(
          "keydown",
          (e) => {
            /* 1 = Invincibility */

            if (e.key === "1") {
              invincible =
                !invincible;

              console.log(
                invincible
                  ? "Invincibility ON"
                  : "Invincibility OFF"
              );
            }

            /* 3 = Blackout */

            if (e.key === "3") {
              blackoutEnabled =
                !blackoutEnabled;

              if (!blackoutEnabled) {
                blackout.classList.remove(
                  "active"
                );

                canvas.classList.add(
                  "gold-mode"
                );
              } else {
                canvas.classList.remove(
                  "gold-mode"
                );
              }

              console.log(
                blackoutEnabled
                  ? "Blackout ON"
                  : "Blackout OFF"
              );
            }

            /* Space = Jump */

            if (
              e.code === "Space" &&
              !gameOver
            ) {
              e.preventDefault();

              jumpBuffer = 8;
            }

            /* 2 = Reset high score */

            if (e.key === "2") {
              highScore = 0;

              localStorage.removeItem(
                "gd_highscore"
              );

              document.getElementById(
                "score"
              ).textContent =
                "Score: " +
                score +
                " | Best: " +
                highScore;
            }
          }
        );

        /* =====================================================
           CLICK
        ===================================================== */

        canvas.addEventListener(
          "click",
          () => {
            if (gameOver) {
              resetGame();
            } else if (
              player.grounded
            ) {
              player.velocityY =
                player.jumpPower;

              player.grounded = false;
            }
          }
        );

        /* =====================================================
           BLACKOUT
        ===================================================== */

        const blackout =
          document.getElementById(
            "blackout"
          );

        let blackoutEnabled = true;

        function triggerBlackout() {
          if (!blackoutEnabled) {
            setTimeout(
              triggerBlackout,
              2000
            );

            return;
          }

          blackout.classList.add(
            "active"
          );

          const duration =
            100 +
            Math.random() * 250;

          setTimeout(() => {
            blackout.classList.remove(
              "active"
            );

            const nextTime =
              5000 +
              Math.random() * 15000;

            setTimeout(
              triggerBlackout,
              nextTime
            );
          }, duration);
        }

        setTimeout(
          triggerBlackout,
          5000 +
            Math.random() * 15000
        );

        /* =====================================================
           SECRET CODE
        ===================================================== */

        const submitCode =
          document.getElementById(
            "submitCode"
          );

        submitCode.addEventListener(
          "click",
          () => {
            const code =
              document.getElementById(
                "secretCode"
              ).value;

            const aboutme =
              document.getElementById(
                "aboutme"
              );

            if (
              code ===
              "!@#$%^&*()"
            ) {
              aboutme.textContent =
                "Press 3 to remove blackout for photosensitive viewers. Press 1 to turn on invincibility and 2 to reset high score.";
            }
          }
        );
      });
    </script>
  </body>
