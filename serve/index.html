
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Server</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&family=Spectral:wght@400;500;600&display=swap" rel="stylesheet">

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html {
  min-height: 100%;
  background: #000;
  scroll-behavior: smooth;
}

body {
  min-height: 100vh;
  color: white;
  font-family: -apple-system, BlinkMacSystemFont,
    "SF Pro Display", "Segoe UI", sans-serif;
  overflow-x: hidden;
  background: #000;
}

/* NAVIGATION */

nav {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  z-index: 10;
  padding: 20px 7%;
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: rgba(8,8,8,.95);
  border-bottom: 1px solid rgba(255,255,255,.08);
}

.logo {
  font-family: "Fredoka", sans-serif;
  font-size: 21px;
  font-weight: 500;
  letter-spacing: .3px;
}

.nav-links {
  display: flex;
  gap: 27px;
}

.nav-links a {
  color: rgba(255,255,255,.75);
  font-size: 14px;
  font-weight: 400;
  text-decoration: none;
  transition: .25s;
}

.nav-links a:hover {
  color: white;
}

/* MAIN CONTENT */

.container {
  width: 86%;
  max-width: 1450px;
  margin: 115px auto 50px;
}

.page-header {
  margin-bottom: 25px;
}

.page-header h1 {
  font-family: "Fredoka", sans-serif;
  font-size: 27px;
  font-weight: 500;
  margin-bottom: 7px;
}

.page-header p {
  color: rgba(255,255,255,.6);
  font-size: 14px;
}

/* GAME PANEL */

.game-panel {
  padding: 22px;
  border-radius: 20px;
  background: #080808;
  border: 1px solid rgba(255,255,255,.09);
  box-shadow: none;
}

.panel-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 15px;
  margin-bottom: 18px;
}

.panel-header h2 {
  font-family: "Fredoka", sans-serif;
  font-size: 18px;
  font-weight: 500;
}

.buttons {
  display: flex;
  gap: 10px;
}

.game-button {
  display: inline-block;
  padding: 10px 17px;
  border-radius: 10px;
  color: white;
  text-decoration: none;
  font-size: 13px;
  font-weight: 500;
  background: #151515;
  border: 1px solid rgba(255,255,255,.12);
  transition: .25s;
  cursor: pointer;
}

.game-button:hover {
  background: #252525;
  border-color: rgba(255,255,255,.3);
  transform: translateY(-2px);
}

.primary {
  background: #202020;
}

/* WEBSITE EMBED */

.game-frame {
  width: 100%;
  height: 720px;
  border: 1px solid rgba(255,255,255,.1);
  border-radius: 14px;
  overflow: hidden;
  background: #080808;
}

.game-frame iframe {
  width: 100%;
  height: 100%;
  border: none;
  background: white;
}

/* FOOTER */

footer {
  text-align: center;
  padding: 25px;
  color: rgba(255,255,255,.4);
  font-size: 12px;
}

/* MOBILE */

@media(max-width: 700px) {
  nav {
    padding: 17px 5%;
  }

  .logo {
    font-size: 18px;
  }

  .nav-links {
    gap: 12px;
  }

  .nav-links a {
    font-size: 11px;
  }

  .container {
    width: 92%;
    margin-top: 100px;
  }

  .game-panel {
    padding: 13px;
  }

  .panel-header {
    align-items: flex-start;
    flex-direction: column;
  }

  .game-frame {
    height: 600px;
  }
}
</style>
</head>

<body>

<nav>
  <div class="logo">The password to the site is "funni".</div>

  <div class="nav-links">
    <a href="/">Home</a>
  </div>
</nav>

<main class="container" id="home">

  <div class="page-header">
  </div>

  <section class="game-panel" id="games">

    <div class="panel-header">

      <div class="buttons">
        <a class="game-button"
           href="https://sme-learning-lessons.us/"
           target="_blank"
           rel="noopener">
          Open in New Tab ↗
        </a>

        <button class="game-button primary"
                onclick="reloadPoki()">
          Reload
        </button>
      </div>
    </div>

    <div class="game-frame">
      <iframe
        id="pokiFrame"
        src="https://sme-learning-lessons.us/"
        title="TrickyBird Website"
        allow="fullscreen; autoplay"
        loading="lazy">
      </iframe>
    </div>

  </section>

</main>

<footer>
</footer>

<script>
function reloadPoki() {
  const frame = document.getElementById("pokiFrame");
  frame.src = "https://sme-learning-lessons.us/";
}
</script>

</body>
</html>
