<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>jasonyen.me</title>
    <link rel="icon" type="image/png" href="/images/favicon.png" />

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family:
          -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI",
          sans-serif;
      }

      html {
        min-height: 100%;
        background: #050816;
        scroll-behavior: smooth;
      }

      body {
        min-height: 100vh;
        position: relative;
        isolation: isolate;
        background: #050816;
        color: white;
        overflow-x: hidden;
      }

      /* ================= BACKGROUND ================= */

      body::before {
        content: "";
        position: fixed;
        inset: 0;
        z-index: -2;
        background:
          radial-gradient(
            circle at 0% 18%,
            rgba(127, 90, 240, 0.95),
            rgba(127, 90, 240, 0.55) 18%,
            transparent 38%
          ),
          radial-gradient(
            circle at 100% 82%,
            rgba(0, 194, 255, 0.55),
            transparent 36%
          ),
          linear-gradient(
            135deg,
            #050816 0%,
            #0b1022 50%,
            #0f172a 100%
          );
        background-repeat: no-repeat;
        background-size: cover;
      }

      /* ================= FLOATING ORBS ================= */

      .orb {
        position: fixed;
        width: 420px;
        height: 420px;
        border-radius: 50%;
        filter: blur(60px);
        opacity: 0.35;
        pointer-events: none;
        z-index: -1;
        animation: float 14s ease-in-out infinite alternate;
      }

      .orb1 {
        top: -120px;
        left: -120px;
        background: #7f5af0;
      }

      .orb2 {
        width: 380px;
        height: 380px;
        bottom: -120px;
        right: -120px;
        background: #00c2ff;
        animation-duration: 18s;
      }

      @keyframes float {
        0% {
          transform: translate(0, 0) scale(1);
        }

        50% {
          transform: translate(40px, 30px) scale(1.05);
        }

        100% {
          transform: translate(-20px, 50px) scale(0.98);
        }
      }

      /* ================= NAVBAR ================= */

      nav {
        width: 100%;
        padding: 24px 7%;
        display: flex;
        justify-content: space-between;
        align-items: center;
        position: fixed;
        top: 0;
        background: rgba(255, 255, 255, 0.05);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        z-index: 1000;
      }

      .logo {
        font-size: 1.5rem;
        font-weight: 700;
        letter-spacing: 1px;
        color: white;
        text-decoration: none;
      }

      .nav-links {
        display: flex;
        gap: 32px;
      }

      .nav-links a {
        text-decoration: none;
        color: rgba(255, 255, 255, 0.8);
        font-size: 0.95rem;
        transition: 0.3s;
      }

      .nav-links a:hover {
        color: white;
      }

      /* ================= MAIN ================= */

      .chatbox {
        width: 90%;
        max-width: 1100px;
        margin: 120px auto 50px;
        padding: 60px;
        background: rgba(255, 255, 255, 0.08);
        backdrop-filter: blur(25px);
        -webkit-backdrop-filter: blur(25px);
        border-radius: 60px;
        border: 1px solid rgba(255, 255, 255, 0.12);
        box-shadow:
          0 8px 32px rgba(0, 0, 0, 0.35),
          inset 0 1px 1px rgba(255, 255, 255, 0.1);
        position: relative;
        z-index: 2;
      }

      .game-title {
        font-size: 1.7rem;
        font-weight: 600;
        margin-bottom: 10px;
      }

      .game-info {
        color: rgba(255, 255, 255, 0.72);
        font-size: 1rem;
        line-height: 1.7;
        margin-bottom: 25px;
      }

      /* ================= GAME ================= */

      #gameCanvas {
        display: block;
        width: 100%;
        max-width: 600px;
        height: auto;
        margin-top: 10px;
        border-radius: 25px;
        background:
          linear-gradient(
            180deg,
            rgba(5, 8, 20, 0.98),
            rgba(15, 23, 42, 0.98)
          );
        border: 1px solid rgba(255, 255, 255, 0.1);
        box-shadow:
          inset 0 0 30px rgba(255, 255, 255, 0.03),
          0 15px 40px rgba(0, 0, 0, 0.35);
      }

      /* ================= BUTTON ================= */

      .game-link {
        position: relative;
        overflow: hidden;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 16px 28px;
        margin-top: 25px;
        border-radius: 18px;
        background: rgba(255, 255, 255, 0.08);
        border: 1px solid rgba(255, 255, 255, 0.1);
        color: white;
        font-size: 1rem;
        font-weight: 600;
        font-family:
          -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI",
          sans-serif;
        transition: 0.35s;
      }

      .game-link:hover {
        transform: translateY(-4px) scale(1.04);
        background: rgba(255, 255, 255, 0.15);
        box-shadow: 0 15px 35px rgba(255, 255, 255, 0.12);
      }

      .game-link:active {
        transform: scale(0.98);
      }

      /* ================= CURSOR ================= */



      /* ================= MOBILE ================= */

      @media (max-width: 768px) {
        body {
          cursor: auto;
        }

        nav {
          padding: 20px 5%;
        }

        .nav-links {
          display: none;
        }

        .chatbox {
          margin-top: 110px;
          padding: 30px;
          border-radius: 35px;
        }

        .game-title {
          font-size: 1.5rem;
        }

        #gameCanvas {
          border-radius: 20px;
        }

        .game-link {
          width: 100%;
        }

      }
    </style>
  </head>

  <body>
    <div class="orb orb1"></div>
    <div class="orb orb2"></div>


    <nav>
      <a href="/" class="logo">Space Invader</a>

      <div class="nav-links">
        <a href="/">Main</a>
        <a href="/games">Games</a>
        <a href="/tools">Tools</a>
        <a href="/radio">Radio</a>
      </div>
    </nav>

    <main class="chatbox">

      <div class="game-info">
        Move with ← → and hold Space to shoot.
      </div>

      <canvas id="gameCanvas" width="600" height="500"></canvas>

      <button id="restartBtn" class="game-link">
        Restart Game
      </button>
    </main>

    <script>
      /* ================= CURSOR ================= */


  
      /* ================= CANVAS ================= */

      const canvas = document.getElementById("gameCanvas");
      const ctx = canvas.getContext("2d");

      let player = {
        x: canvas.width / 2 - 20,
        y: canvas.height - 40,
        w: 40,
        h: 20,
        speed: 5,
      };

      let bullets = [];
      let enemies = [];
      let enemyDirection = 1;
      let gameOver = false;
      let enemyHue = 0;

      function spawnRow(y) {
        for (let c = 0; c < 8; c++) {
          enemies.push({
            x: 80 + c * 45,
            y: y,
            w: 20,
            h: 14,
          });
        }
      }

      function roundRect(
        ctx,
        x,
        y,
        width,
        height,
        radius,
        fill,
        stroke
      ) {
        if (typeof radius === "number") {
          radius = {
            tl: radius,
            tr: radius,
            br: radius,
            bl: radius,
          };
        }

        ctx.beginPath();
        ctx.moveTo(x + radius.tl, y);
        ctx.lineTo(x + width - radius.tr, y);

        ctx.quadraticCurveTo(
          x + width,
          y,
          x + width,
          y + radius.tr
        );

        ctx.lineTo(
          x + width,
          y + height - radius.br
        );

        ctx.quadraticCurveTo(
          x + width,
          y + height,
          x + width - radius.br,
          y + height
        );

        ctx.lineTo(x + radius.bl, y + height);

        ctx.quadraticCurveTo(
          x,
          y + height,
          x,
          y + height - radius.bl
        );

        ctx.lineTo(x, y + radius.tl);

        ctx.quadraticCurveTo(
          x,
          y,
          x + radius.tl,
          y
        );

        ctx.closePath();

        if (fill) ctx.fill();
        if (stroke) ctx.stroke();
      }

      spawnRow(-30);

      /* ================= CONTROLS ================= */

      let keys = {};
      let shootTimer = 0;
      const shootInterval = 6;

      document.addEventListener("keydown", (e) => {
        keys[e.key] = true;
      });

      document.addEventListener("keyup", (e) => {
        keys[e.key] = false;
      });

      /* ================= UPDATE ================= */

      function update() {
        if (gameOver) return;

        shootTimer++;

        if (keys[" "] && shootTimer >= shootInterval) {
          bullets.push({
            x: player.x + player.w / 2 - 2,
            y: player.y,
            w: 4,
            h: 10,
          });

          shootTimer = 0;
        }

        let topMost =
          enemies.length > 0
            ? Math.min(...enemies.map((e) => e.y))
            : 999;

        if (topMost > 40) {
          spawnRow(-30);
        }

        if (keys["ArrowLeft"]) {
          player.x -= player.speed;
        }

        if (keys["ArrowRight"]) {
          player.x += player.speed;
        }

        player.x = Math.max(
          0,
          Math.min(canvas.width - player.w, player.x)
        );

        bullets.forEach((b) => {
          b.y -= 10;
        });

        bullets = bullets.filter((b) => b.y > 0);

        let hitEdge = false;

        enemies.forEach((e) => {
          e.x += enemyDirection * 1.5;

          e.y += 0.4;
          e.y += 0.3;
          e.y += 0.5;

          if (e.x < 0 || e.x + e.w > canvas.width) {
            hitEdge = true;
          }

          if (
            e.x < player.x + player.w &&
            e.x + e.w > player.x &&
            e.y < player.y + player.h &&
            e.y + e.h > player.y
          ) {
            gameOver = true;
          }

          if (e.y + e.h >= canvas.height) {
            gameOver = true;
          }
        });

        if (hitEdge) {
          enemyDirection *= -1;

          enemies.forEach((e) => {
            e.y += 10;
          });
        }

        bullets.forEach((b, bi) => {
          enemies.forEach((e, ei) => {
            if (
              b.x < e.x + e.w &&
              b.x + b.w > e.x &&
              b.y < e.y + e.h &&
              b.y + b.h > e.y
            ) {
              enemies.splice(ei, 1);
              bullets.splice(bi, 1);
            }
          });
        });

        enemies = enemies.filter(
          (e) => e.y < canvas.height + 40
        );

        enemyHue += 1;
      }

      /* ================= SCORE ================= */

      let startTime = Date.now();
      let score = 0;
      let highScore =
        localStorage.getItem("spaceHighScore") || 0;

      /* ================= DRAW ================= */

      function draw() {
        ctx.clearRect(
          0,
          0,
          canvas.width,
          canvas.height
        );

        score = Math.floor(
          (Date.now() - startTime) / 1000
        );

        if (score > highScore) {
          highScore = score;

          localStorage.setItem(
            "spaceHighScore",
            highScore
          );
        }

        /* SCORE PANEL */

        ctx.fillStyle =
          "rgba(255,255,255,0.08)";

        roundRect(
          ctx,
          14,
          14,
          180,
          62,
          18,
          true
        );

        const gradient =
          ctx.createLinearGradient(0, 0, 200, 0);

        gradient.addColorStop(0, "#7f5af0");
        gradient.addColorStop(1, "#00c2ff");

        ctx.fillStyle = gradient;

        ctx.font =
          '600 18px -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", sans-serif';

        ctx.fillText(
          `Score: ${score}s`,
          28,
          40
        );

        ctx.fillText(
          `Best: ${highScore}s`,
          28,
          65
        );

        /* PLAYER */

        ctx.shadowBlur = 20;
        ctx.shadowColor = "#00ffcc";
        ctx.fillStyle = "#00ffcc";

        roundRect(
          ctx,
          player.x,
          player.y,
          player.w,
          player.h,
          6,
          true
        );

        /* BULLETS */

        bullets.forEach((b) => {
          const bulletGradient =
            ctx.createLinearGradient(
              b.x,
              b.y,
              b.x,
              b.y + b.h
            );

          bulletGradient.addColorStop(
            0,
            "#ffffff"
          );

          bulletGradient.addColorStop(
            1,
            "#8f9fff"
          );

          ctx.fillStyle = bulletGradient;
          ctx.shadowBlur = 18;
          ctx.shadowColor = "#8f9fff";

          roundRect(
            ctx,
            b.x,
            b.y,
            b.w,
            b.h,
            10,
            true
          );
        });

        /* ENEMIES */

        enemies.forEach((e) => {
          const enemyColor =
            `hsl(${enemyHue}, 80%, 60%)`;

          ctx.shadowBlur = 15;
          ctx.shadowColor = enemyColor;
          ctx.fillStyle = enemyColor;

          roundRect(
            ctx,
            e.x,
            e.y,
            e.w,
            e.h,
            5,
            true
          );
        });

        /* GAME OVER */

        if (gameOver) {
          ctx.fillStyle =
            "rgba(0,0,0,0.55)";

          ctx.fillRect(
            0,
            0,
            canvas.width,
            canvas.height
          );

          ctx.fillStyle =
            "rgba(20,25,40,0.82)";

          roundRect(
            ctx,
            canvas.width / 2 - 170,
            canvas.height / 2 - 110,
            340,
            180,
            28,
            true
          );

          ctx.strokeStyle =
            "rgba(143,159,255,0.6)";

          ctx.lineWidth = 2;

          roundRect(
            ctx,
            canvas.width / 2 - 170,
            canvas.height / 2 - 110,
            340,
            180,
            28,
            false,
            true
          );

          const overGradient =
            ctx.createLinearGradient(
              160,
              0,
              430,
              0
            );

          overGradient.addColorStop(
            0,
            "#7f5af0"
          );

          overGradient.addColorStop(
            1,
            "#00c2ff"
          );

          ctx.fillStyle = overGradient;

          ctx.font =
            '600 42px -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", sans-serif';

          ctx.fillText(
            "GAME OVER",
            canvas.width / 2 - 125,
            canvas.height / 2 - 25
          );

          ctx.fillStyle = "#ffffff";

          ctx.font =
            '20px -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", sans-serif';

          ctx.fillText(
            `Score: ${score}s`,
            canvas.width / 2 - 55,
            canvas.height / 2 + 18
          );

          ctx.fillText(
            `Best: ${highScore}s`,
            canvas.width / 2 - 50,
            canvas.height / 2 + 48
          );
        }

        ctx.shadowBlur = 0;
      }

      /* ================= RESTART ================= */

      const restartBtn =
        document.getElementById("restartBtn");

      function restartGame() {
        player = {
          x: canvas.width / 2 - 20,
          y: canvas.height - 40,
          w: 40,
          h: 20,
          speed: 5,
        };

        bullets = [];
        enemies = [];
        enemyDirection = 1;
        enemyHue = 0;
        gameOver = false;
        startTime = Date.now();
        score = 0;

        spawnRow(-30);

        loop();
      }

      restartBtn.onclick = restartGame;

      /* ================= LOOP ================= */

      function loop() {
        update();
        draw();

        if (!gameOver) {
          requestAnimationFrame(loop);
        }
      }

      loop();
    </script>
  </body>
</html>
