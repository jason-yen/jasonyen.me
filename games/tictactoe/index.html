<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <title>jasonyen.me</title>

    <link rel="icon" type="image/png" href="/images/favicon.png" />

    <style>
      /* ================= GLOBAL ================= */

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family:
          -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI",
          sans-serif;
      }

      html {
        min-height: 100%;
        background: #050816;
        scroll-behavior: smooth;
      }

      body {
        min-height: 100vh;
        position: relative;
        isolation: isolate;
        background: #050816;
        color: white;
        overflow-x: hidden;
      }

      /* ================= BACKGROUND ================= */

      body::before {
        content: "";
        position: fixed;
        inset: 0;
        z-index: -2;

        background:
          radial-gradient(
            circle at 0% 18%,
            rgba(127, 90, 240, 0.95),
            rgba(127, 90, 240, 0.55) 18%,
            transparent 38%
          ),
          radial-gradient(
            circle at 100% 82%,
            rgba(0, 194, 255, 0.55),
            transparent 36%
          ),
          linear-gradient(
            135deg,
            #050816 0%,
            #0b1022 50%,
            #0f172a 100%
          );

        background-repeat: no-repeat;
        background-size: cover;
      }

      /* ================= FLOATING ORBS ================= */

      .orb {
        position: fixed;
        width: 420px;
        height: 420px;
        border-radius: 50%;
        filter: blur(60px);
        opacity: 0.35;
        pointer-events: none;
        z-index: -1;
        animation: float 14s ease-in-out infinite alternate;
      }

      .orb1 {
        top: -120px;
        left: -120px;
        background: #7f5af0;
      }

      .orb2 {
        width: 380px;
        height: 380px;
        bottom: -120px;
        right: -120px;
        background: #00c2ff;
        animation-duration: 18s;
      }

      @keyframes float {
        0% {
          transform: translate(0, 0) scale(1);
        }

        50% {
          transform: translate(40px, 30px) scale(1.05);
        }

        100% {
          transform: translate(-20px, 50px) scale(0.98);
        }
      }

      /* ================= NAVBAR ================= */

      nav {
        width: 100%;
        padding: 24px 7%;

        display: flex;
        justify-content: space-between;
        align-items: center;

        position: fixed;
        top: 0;

        background: rgba(255, 255, 255, 0.05);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);

        border-bottom: 1px solid rgba(255, 255, 255, 0.08);

        z-index: 1000;
      }

      .logo {
        font-size: 1.5rem;
        font-weight: 700;
        letter-spacing: 1px;
        color: white;
        text-decoration: none;
      }

      .nav-links {
        display: flex;
        gap: 32px;
      }

      .nav-links a {
        text-decoration: none;
        color: rgba(255, 255, 255, 0.8);
        font-size: 0.95rem;
        transition: 0.3s;
      }

      .nav-links a:hover {
        color: white;
      }

      /* ================= MAIN GLASS BOX ================= */

      .chatbox {
        width: 90%;
        max-width: 1100px;

        margin: 120px auto 50px;
        padding: 60px;

        background: rgba(255, 255, 255, 0.08);
        backdrop-filter: blur(25px);
        -webkit-backdrop-filter: blur(25px);

        border-radius: 60px;
        border: 1px solid rgba(255, 255, 255, 0.12);

        box-shadow:
          0 8px 32px rgba(0, 0, 0, 0.35),
          inset 0 1px 1px rgba(255, 255, 255, 0.1);

        position: relative;
        z-index: 2;
      }

      /* ================= GAME HEADER ================= */

      .game-header {
        margin-bottom: 30px;
      }

      .game-header h1 {
        font-size: 1.7rem;
        font-weight: 600;
        margin-bottom: 10px;
      }

      .game-header p {
        color: rgba(255, 255, 255, 0.7);
        font-size: 0.95rem;
        line-height: 1.6;
      }

      /* ================= GAME ================= */

      .game-container {
        margin-top: 30px;
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(3, 110px);
        gap: 12px;
        justify-content: start;
      }

      /* ================= CELLS ================= */

      .cell {
        width: 110px;
        height: 110px;

        background: rgba(255, 255, 255, 0.08);

        border-radius: 20px;
        border: 1px solid rgba(255, 255, 255, 0.1);

        display: flex;
        align-items: center;
        justify-content: center;

        color: white;
        font-size: 38px;
        font-weight: 600;

        cursor: pointer;
        user-select: none;

        box-shadow:
          0 8px 25px rgba(0, 0, 0, 0.2),
          inset 0 1px 1px rgba(255, 255, 255, 0.05);

        transition:
          transform 0.15s ease,
          box-shadow 0.2s ease,
          background 0.2s ease;

        -webkit-tap-highlight-color: transparent;
        touch-action: manipulation;
      }

      .cell:hover {
        transform: scale(1.05);

        background: rgba(255, 255, 255, 0.14);

        box-shadow:
          0 14px 30px rgba(0, 0, 0, 0.3),
          inset 0 1px 1px rgba(255, 255, 255, 0.08);
      }

      .cell:active {
        transform: scale(0.92);
      }

      .cell.taken {
        pointer-events: none;
      }

      /* ================= WIN / LOSE ================= */

      .winner {
        background: rgba(109, 255, 143, 0.3) !important;
        border-color: rgba(109, 255, 143, 0.6);

        box-shadow:
          0 0 18px rgba(109, 255, 143, 0.4),
          inset 0 1px 1px rgba(255, 255, 255, 0.1);
      }

      .loser {
        opacity: 0.4;
      }

      /* ================= MESSAGE ================= */

      #message {
        margin-top: 24px;

        font-size: 1rem;
        font-weight: 500;

        color: rgba(255, 255, 255, 0.9);
        min-height: 24px;
      }

      /* ================= REPLAY BUTTON ================= */

      #replayButton {
        margin-top: 20px;

        padding: 16px 28px;

        border-radius: 18px;

        background: rgba(255, 255, 255, 0.08);
        border: 1px solid rgba(255, 255, 255, 0.1);

        color: white;
        font-weight: 600;
        font-size: 1rem;

        cursor: pointer;

        transition: 0.35s;
      }

      #replayButton:hover {
        transform: translateY(-4px) scale(1.04);

        background: rgba(255, 255, 255, 0.15);

        box-shadow:
          0 15px 35px rgba(255, 255, 255, 0.12);
      }

      #replayButton:active {
        transform: translateY(-1px) scale(0.98);
      }

      /* ================= MOBILE ================= */

      @media (max-width: 768px) {
        nav {
          padding: 20px 5%;
        }

        .nav-links {
          display: none;
        }

        .chatbox {
          margin-top: 110px;
          padding: 30px;
          border-radius: 35px;
        }

        .game-header h1 {
          font-size: 1.5rem;
        }

        .grid {
          grid-template-columns: repeat(3, 90px);
          gap: 10px;
        }

        .cell {
          width: 90px;
          height: 90px;
          font-size: 32px;
          border-radius: 18px;
        }
      }

      @media (max-width: 400px) {
        .grid {
          grid-template-columns: repeat(3, 75px);
          gap: 8px;
        }

        .cell {
          width: 75px;
          height: 75px;
          font-size: 28px;
        }
      }
    </style>
  </head>

  <body>
    <!-- Background orbs -->
    <div class="orb orb1"></div>
    <div class="orb orb2"></div>

    <!-- ================= NAVBAR ================= -->

    <nav>
      <a href="/" class="logo">Tic Tac Toe</a>

      <div class="nav-links">
        <a href="/">Main</a>
        <a href="/games">Games</a>
        <a href="/tools">Tools</a>
        <a href="/shuffler">Shuffler</a>
      </div>
    </nav>

    <!-- ================= MAIN ================= -->

    <main class="chatbox">
      <div class="game-header">
        <p>Play against the computer.</p>
      </div>

      <div class="game-container">
        <div class="grid">
          <div class="cell"></div>
          <div class="cell"></div>
          <div class="cell"></div>

          <div class="cell"></div>
          <div class="cell"></div>
          <div class="cell"></div>

          <div class="cell"></div>
          <div class="cell"></div>
          <div class="cell"></div>
        </div>

        <div id="message"></div>

        <button id="replayButton" onclick="resetGame()">
          Replay
        </button>
      </div>
    </main>

    <!-- ================= GAME SCRIPT ================= -->

    <script>
      let board = Array(9).fill("");
      let currentPlayer = "X";
      let gameOver = false;

      const cells = document.querySelectorAll(".cell");

      cells.forEach((cell, i) => {
        cell.addEventListener("click", (e) => {
          e.preventDefault();
          makeMove(i);
        });
      });

      const patterns = [
        [0, 1, 2],
        [3, 4, 5],
        [6, 7, 8],
        [0, 3, 6],
        [1, 4, 7],
        [2, 5, 8],
        [0, 4, 8],
        [2, 4, 6],
      ];

      function makeMove(i) {
        if (gameOver || board[i] !== "") return;

        board[i] = currentPlayer;
        cells[i].textContent = currentPlayer;
        cells[i].classList.add("taken");

        if (checkWinner(currentPlayer)) {
          endGame(currentPlayer + " wins!");
          return;
        }

        if (board.every((c) => c !== "")) {
          endGame("Tie!");
          return;
        }

        currentPlayer = currentPlayer === "X" ? "O" : "X";

        if (currentPlayer === "O") {
          computerMove();
        }
      }

      function checkWinner(p) {
        for (const [a, b, c] of patterns) {
          if (
            board[a] === p &&
            board[b] === p &&
            board[c] === p
          ) {
            [a, b, c].forEach((i) => {
              cells[i].classList.add("winner");
            });

            cells.forEach((cell, idx) => {
              if (![a, b, c].includes(idx)) {
                cell.classList.add("loser");
              }
            });

            return true;
          }
        }

        return false;
      }

      function endGame(t) {
        document.getElementById("message").textContent = t;
        gameOver = true;
      }

      function computerMove() {
        let best = -Infinity;
        let move;

        for (let i = 0; i < 9; i++) {
          if (board[i] === "") {
            board[i] = "O";

            let score = minimax(board, 0, false);

            board[i] = "";

            if (score > best) {
              best = score;
              move = i;
            }
          }
        }

        setTimeout(() => {
          makeMove(move);
        }, 270);
      }

      function minimax(bd, d, isMax) {
        if (checkWinBoard(bd, "O")) return 10 - d;
        if (checkWinBoard(bd, "X")) return d - 10;
        if (bd.every((c) => c !== "")) return 0;

        if (isMax) {
          let best = -Infinity;

          for (let i = 0; i < 9; i++) {
            if (bd[i] === "") {
              bd[i] = "O";

              best = Math.max(
                best,
                minimax(bd, d + 1, false)
              );

              bd[i] = "";
            }
          }

          return best;
        } else {
          let best = Infinity;

          for (let i = 0; i < 9; i++) {
            if (bd[i] === "") {
              bd[i] = "X";

              best = Math.min(
                best,
                minimax(bd, d + 1, true)
              );

              bd[i] = "";
            }
          }

          return best;
        }
      }

      function checkWinBoard(bd, p) {
        return patterns.some(
          ([a, b, c]) =>
            bd[a] === p &&
            bd[b] === p &&
            bd[c] === p
        );
      }

      function resetGame() {
        board = Array(9).fill("");

        document.querySelectorAll(".cell").forEach((c) => {
          c.textContent = "";
          c.classList.remove(
            "taken",
            "winner",
            "loser"
          );
        });

        document.getElementById("message").textContent = "";

        currentPlayer = "X";
        gameOver = false;
      }
    </script>
  </body>
</html>
