    <style>

      body::before {

      /* ================= ORBS ================= */

      .orb {

      nav {

      /* ================= GAME CARD ================= */

      .gamebox {

        background: rgba(255, 255, 255, 0.08);

        backdrop-filter: blur(25px);

        border-radius: 60px;

        border: 1px solid rgba(255, 255, 255, 0.12);

      .game-area {

      .mobile-warning {

      /* ================= CANVAS ================= */

      #gameCanvas {

  <body>
    <!-- Background -->
    <div class="orb orb1"></div>
    <div class="orb orb2"></div>

    <!-- ================= NAVBAR ================= -->

    <nav>
      <div class="logo">Pixel Survivor</div>

      <div class="nav-links">
        <a href="/">Main</a>
        <a href="/games">Games</a>
        <a href="/tools">Tools</a>
        <a href="/radio">Radio</a>
      </div>
    </nav>

    <!-- ================= GAME ================= -->

    <main class="gamebox">
      <div class="game-header">

        <p>
          Survive the waves, collect abilities, and see how long you can last.
        </p>
      </div>

      <div class="game-area">
        <a class="game-link" onclick="startGame()">
          Begin
        </a>

        <div class="mobile-warning" id="mobileMsg">
          This game cannot be played on mobile.
          Please use a computer.
        </div>

        <canvas id="gameCanvas"></canvas>

        <div id="ui"></div>
      </div>
    </main>

    <script>
      /* ================= MOBILE CHECK ================= */

      function isMobile() {
        return /Mobi|Android|iPhone/i.test(
          navigator.userAgent
        );
      }

      if (isMobile()) {
        document.getElementById("mobileMsg").style.display =
          "block";
      }

      /* ================= GAME ================= */

      const canvas =
        document.getElementById("gameCanvas");

      const ctx =
        canvas.getContext("2d");

      canvas.width = 600;
      canvas.height = 400;

      let player,
        enemies,
        bullets,
        keys = {},
        gameOver = false;

      let kills = 0,
        paused = false,
        moveDir = {
          x: 0,
          y: 0
        },
        obtained = new Set();

      let abilities = {
        darkMagic: false,
        waves: false,
        spirit: false,
        laser: false,
        multi: false,
        heal: false
      };

      let spirit = null,
        pulses = [],
        darkActive = true,
        darkTimer = 0,
        lastLevelUp = 0,
        startTime = 0;

      let difficulty = 1;
      let chaosLevel = 1;

      /* ================= INPUT ================= */

      document.addEventListener(
        "keydown",
        (e) => {
          keys[e.key.toLowerCase()] = true;
        }
      );

      document.addEventListener(
        "keyup",
        (e) => {
          keys[e.key.toLowerCase()] = false;
        }
      );

      /* ================= INIT ================= */

      function init() {
        player = {
          x: 300,
          y: 200,
          speed: 3,
          hp: 20
        };

        enemies = [];
        bullets = [];

        kills = 0;

        gameOver = false;
        paused = false;

        obtained.clear();

        abilities = {
          darkMagic: false,
          waves: false,
          spirit: false,
          laser: false,
          multi: false,
          heal: false
        };

        spirit = null;
        pulses = [];

        darkActive = true;
        darkTimer = Date.now();

        lastLevelUp = Date.now();
        startTime = Date.now();

        lastSpawnTime = Date.now();
      }

      /* ================= START ================= */

      function startGame() {
        if (isMobile()) {
          document.getElementById("mobileMsg").style.display =
            "block";

          return;
        }

        canvas.style.display = "block";

        init();
      }

      /* ================= POWERUPS ================= */

      const powerups = [
        {
          name: "Dark Magic",
          key: "darkMagic",
          effect: () =>
            (abilities.darkMagic = true)
        },

        {
          name: "Void Pulse",
          key: "waves",
          effect: () =>
            (abilities.waves = true)
        },

        {
          name: "Spirit",
          key: "spirit",
          effect: () =>
            (abilities.spirit = true)
        },

        {
          name: "Heal",
          key: "heal",
          effect: () =>
            obtained.add("heal")
        }
      ];

      /* ================= LEVEL UP ================= */

      function showLevelUp() {
        paused = true;

        const ui =
          document.getElementById("ui");

        ui.style.display = "flex";
        ui.innerHTML = "";

        let available =
          powerups.filter(
            (p) =>
              !obtained.has(p.key)
          );

        if (available.length === 0) {
          paused = false;
          return;
        }

        let choices =
          available
            .sort(
              () =>
                Math.random() - 0.5
            )
            .slice(0, 3);

        choices.forEach((p) => {
          let btn =
            document.createElement("a");

          btn.className =
            "game-link";

          btn.textContent =
            p.name;

          btn.onclick = () => {
            p.effect();

            obtained.add(
              p.key
            );

            ui.innerHTML = "";

            paused = false;

            lastLevelUp =
              Date.now();
          };

          ui.appendChild(btn);
        });
      }

      /* ================= SPAWN ================= */

      let lastSpawnTime =
        Date.now();

      setInterval(() => {
        if (
          gameOver ||
          paused ||
          !player
        )
          return;

        let now = Date.now();

        let allUnlocked =
          obtained.size >=
          powerups.length;

        difficulty =
          1 +
          (now - startTime) /
            20000;

        if (
          allUnlocked &&
          Math.random() < 0.02
        ) {
          chaosLevel += 0.002;
        }

        let spawnRate =
          allUnlocked
            ? 250
            : 800;

        if (
          now - lastSpawnTime <
          spawnRate
        )
          return;

        lastSpawnTime = now;

        let scale =
          difficulty *
          (allUnlocked ? 3 : 1);

        let count;

        if (allUnlocked) {
          count =
            6 +
            Math.floor(
              difficulty * 2
            );
        } else {
          count =
            1 +
            Math.floor(
              difficulty / 2
            );
        }

        for (
          let i = 0;
          i < count;
          i++
        ) {
          let spawnType =
            Math.random();

          let x, y;

          if (
            allUnlocked &&
            spawnType < 0.5
          ) {
            let minDist = 80;

            do {
              x =
                player.x +
                (Math.random() - 0.5) *
                  300;

              y =
                player.y +
                (Math.random() - 0.5) *
                  300;
            } while (
              Math.hypot(
                x - player.x,
                y - player.y
              ) < minDist
            );
          } else {
            x =
              Math.random() *
              canvas.width;

            y =
              Math.random() *
              canvas.height;
          }

          enemies.push({
            x: x,
            y: y,

            speed:
              2 +
              Math.random() *
                scale,

            size:
              6 +
              Math.min(
                scale,
                12
              ),

            color:
              allUnlocked
                ? "magenta"
                : "red",

            hp:
              Math.floor(
                3 +
                  scale * 0.7
              ),

            type:
              Math.random() < 0.6
                ? "chaser"
                : "strafer",

            attackCooldown: 0
          });
        }
      }, 50);

      /* ================= VOID PULSE ================= */

      function updateWaves() {
        if (!abilities.waves)
          return;

        let now = Date.now();

        if (!updateWaves.last)
          updateWaves.last = now;

        if (
          now -
            updateWaves.last >
          10000
        ) {
          updateWaves.last = now;

          pulses.push({
            x: player.x,
            y: player.y,
            r: 0,
            max: 140
          });
        }

        pulses.forEach((p) => {
          p.r += 3;

          ctx.beginPath();

          ctx.arc(
            p.x,
            p.y,
            p.r,
            0,
            Math.PI * 2
          );

          ctx.strokeStyle =
            "orange";

          ctx.lineWidth = 4;

          ctx.stroke();

          enemies.forEach(
            (e) => {
              let dx =
                e.x - p.x;

              let dy =
                e.y - p.y;

              let dist =
                Math.hypot(
                  dx,
                  dy
                );

              if (
                dist < p.r &&
                dist >
                  p.r - 10
              ) {
                e.hp--;

                if (
                  e.hp <= 0
                ) {
                  killEnemy(e);
                }
              }
            }
          );
        });

        pulses =
          pulses.filter(
            (p) =>
              p.r < p.max
          );
      }

      /* ================= DARK MAGIC ================= */

      function updateDarkMagic() {
        if (
          !abilities.darkMagic
        )
          return;

        for (
          let i = 0;
          i < 6;
          i++
        ) {
          let angle =
            Date.now() /
              200 +
            i;

          let ox =
            player.x +
            Math.cos(angle) *
              25;

          let oy =
            player.y +
            Math.sin(angle) *
              25;

          ctx.fillStyle =
            "purple";

          ctx.fillRect(
            ox,
            oy,
            4,
            4
          );

          enemies =
            enemies.filter(
              (e) => {
                if (
                  Math.hypot(
                    e.x - ox,
                    e.y - oy
                  ) < 12
                ) {
                  killEnemy(e);
                  return false;
                }

                return true;
              }
            );
        }
      }

      /* ================= SPIRIT ================= */

      function updateSpirit() {
        if (
          !abilities.spirit
        )
          return;

        if (!spirit) {
          spirit = {
            x: player.x,
            y: player.y
          };
        }

        spirit.x +=
          (player.x -
            spirit.x) *
          0.05;

        spirit.y +=
          (player.y -
            spirit.y) *
          0.05;

        ctx.fillStyle =
          "cyan";

        ctx.fillRect(
          spirit.x,
          spirit.y,
          5,
          5
        );

        enemies =
          enemies.filter(
            (e) => {
              if (
                Math.hypot(
                  e.x -
                    spirit.x,
                  e.y -
                    spirit.y
                ) < 15
              ) {
                killEnemy(e);
                return false;
              }

              return true;
            }
          );
      }

      /* ================= LASER ================= */

      function drawLaser() {
        if (!abilities.laser)
          return;

        let dx =
          moveDir.x;

        let dy =
          moveDir.y;

        let d =
          Math.hypot(
            dx,
            dy
          );

        if (d === 0) {
          dx = 0;
          dy = -1;
          d = 1;
        }

        ctx.strokeStyle =
          "lime";

        ctx.beginPath();

        ctx.moveTo(
          player.x,
          player.y
        );

        ctx.lineTo(
          player.x +
            (dx / d) *
              600,

          player.y +
            (dy / d) *
              600
        );

        ctx.stroke();

        enemies =
          enemies.filter(
            (e) => {
              let dist =
                Math.abs(
                  (e.x -
                    player.x) *
                    (dy / d) -
                    (e.y -
                      player.y) *
                      (dx / d)
                );

              if (
                dist < 10
              ) {
                killEnemy(e);
                return false;
              }

              return true;
            }
          );
      }

      /* ================= KILL ================= */

      function killEnemy(e) {
        if (!e)
          return;

        kills++;

        if (
          obtained.has("heal")
        ) {
          player.hp += 5;

          if (
            player.hp > 20
          )
            player.hp = 20;
        }

        if (
          Math.random() <
          0.35 * chaosLevel
        ) {
          for (
            let i = 0;
            i < 3;
            i++
          ) {
            enemies.push({
              x: e.x,
              y: e.y,

              speed:
                3 +
                chaosLevel,

              size: 5,

              color:
                "orange",

              hp: 1,

              type:
                "chaser",

              attackCooldown: 0
            });
          }
        }

        if (
          e.size > 7 &&
          Math.random() < 0.6
        ) {
          for (
            let i = 0;
            i < 2;
            i++
          ) {
            enemies.push({
              x:
                e.x +
                (Math.random() -
                  0.5) *
                  20,

              y:
                e.y +
                (Math.random() -
                  0.5) *
                  20,

              speed:
                Math.min(
                  e.speed +
                    0.5,
                  5
                ),

              size:
                e.size *
                0.7,

              color:
                "yellow",

              hp:
                Math.max(
                  1,
                  e.hp - 1
                ),

              type:
                "chaser",

              attackCooldown: 0
            });
          }
        }
      }

      /* ================= GAME LOOP ================= */

      function loop() {
        ctx.clearRect(
          0,
          0,
          600,
          400
        );

        if (
          player &&
          !gameOver &&
          !paused
        ) {
          difficulty =
            1 +
            (Date.now() -
              startTime) /
              20000;

          let allUnlocked =
            obtained.size >=
            powerups.length;

          moveDir.x = 0;
          moveDir.y = 0;

          if (
            keys["w"] ||
            keys["arrowup"]
          )
            moveDir.y = -1;

          if (
            keys["s"] ||
            keys["arrowdown"]
          )
            moveDir.y = 1;

          if (
            keys["a"] ||
            keys["arrowleft"]
          )
            moveDir.x = -1;

          if (
            keys["d"] ||
            keys["arrowright"]
          )
            moveDir.x = 1;

          let d =
            Math.hypot(
              moveDir.x,
              moveDir.y
            ) || 1;

          player.x +=
            (moveDir.x / d) *
            player.speed;

          player.y +=
            (moveDir.y / d) *
            player.speed;

          player.x =
            Math.max(
              0,
              Math.min(
                canvas.width - 6,
                player.x
              )
            );

          player.y =
            Math.max(
              0,
              Math.min(
                canvas.height - 6,
                player.y
              )
            );

          /* ENEMIES */

          enemies.forEach(
            (e) => {
              let dx =
                player.x -
                e.x;

              let dy =
                player.y -
                e.y;

              if (
                e.type ===
                "chaser"
              ) {
                let px =
                  player.x +
                  moveDir.x *
                    20;

                let py =
                  player.y +
                  moveDir.y *
                    20;

                dx =
                  px - e.x;

                dy =
                  py - e.y;
              } else {
                dx +=
                  Math.sin(
                    Date.now() /
                      300
                  ) * 20;

                dy +=
                  Math.cos(
                    Date.now() /
                      300
                  ) * 20;
              }

              let d2 =
                Math.hypot(
                  dx,
                  dy
                ) || 1;

              if (
                Date.now() >
                e.attackCooldown
              ) {
                e.speed += 1;

                e.attackCooldown =
                  Date.now() +
                  2000;
              }

              e.x +=
                (dx / d2) *
                e.speed;

              e.y +=
                (dy / d2) *
                e.speed;

              e.speed *=
                0.98;

              if (
                e.speed <
                0.5
              )
                e.speed = 0.5;

              if (allUnlocked) {
                let maxSpeed =
                  4 +
                  difficulty *
                    0.5;

                e.speed =
                  Math.min(
                    e.speed,
                    maxSpeed
                  );

                let predictBoost =
                  40 +
                  difficulty *
                    5;

                dx =
                  player.x +
                  moveDir.x *
                    predictBoost -
                  e.x;

                dy =
                  player.y +
                  moveDir.y *
                    predictBoost -
                  e.y;

                if (
                  Math.random() <
                  0.02
                ) {
                  e.x +=
                    (Math.random() -
                      0.5) *
                    120;

                  e.y +=
                    (Math.random() -
                      0.5) *
                    120;
                }

                if (
                  Math.random() <
                  0.08
                ) {
                  enemies.push({
                    x:
                      player.x +
                      (Math.random() -
                        0.5) *
                        150,

                    y:
                      player.y +
                      (Math.random() -
                        0.5) *
                        150,

                    speed:
                      4 +
                      difficulty,

                    size: 8,

                    color:
                      "magenta",

                    hp: 6,

                    type:
                      "chaser",

                    attackCooldown: 0
                  });
                }

                player.hp -=
                  0.01 +
                  difficulty *
                    0.002;

                if (
                  Math.random() <
                  0.01
                ) {
                  player.x +=
                    (Math.random() -
                      0.5) *
                    10;

                  player.y +=
                    (Math.random() -
                      0.5) *
                    10;
                }
              }

              e.x =
                Math.max(
                  0,
                  Math.min(
                    canvas.width -
                      e.size,
                    e.x
                  )
                );

              e.y =
                Math.max(
                  0,
                  Math.min(
                    canvas.height -
                      e.size,
                    e.y
                  )
                );

              ctx.fillStyle =
                e.color;

              ctx.fillRect(
                e.x,
                e.y,
                e.size,
                e.size
              );

              if (
                Math.hypot(
                  player.x -
                    e.x,
                  player.y -
                    e.y
                ) < 8
              ) {
                player.hp--;

                if (
                  player.hp <= 0
                ) {
                  gameOver = true;
                }
              }
            }
          );

          /* BULLETS */

          bullets =
            bullets.filter(
              (b) => {
                b.x +=
                  b.dx *
                  b.speed;

                b.y +=
                  b.dy *
                  b.speed;

                if (
                  b.x < 0 ||
                  b.x >
                    canvas.width ||
                  b.y < 0 ||
                  b.y >
                    canvas.height
                )
                  return false;

                ctx.fillStyle =
                  "white";

                ctx.fillRect(
                  b.x,
                  b.y,
                  2,
                  2
                );

                enemies =
                  enemies.filter(
                    (e) => {
                      if (
                        Math.abs(
                          b.x -
                            e.x
                        ) < 6 &&
                        Math.abs(
                          b.y -
                            e.y
                        ) < 6
                      ) {
                        e.hp--;

                        if (
                          e.hp <= 0
                        ) {
                          killEnemy(
                            e
                          );

                          return false;
                        }
                      }

                      return true;
                    }
                  );

                return true;
              }
            );

          /* ABILITIES */

          drawLaser();
          updateDarkMagic();
          updateWaves();
          updateSpirit();

          /* PLAYER */

          ctx.fillStyle =
            "#7f5af0";

          ctx.fillRect(
            player.x,
            player.y,
            6,
            6
          );

          /* HUD */

          ctx.font =
            '14px "Fredoka", sans-serif';

          ctx.fillStyle =
            "rgba(255,255,255,0.9)";

          ctx.fillText(
            "HP: " +
              Math.floor(
                player.hp
              ),
            12,
            22
          );

          ctx.fillText(
            "KILLS: " +
              kills,
            12,
            42
          );
        }

        /* LEVEL UP */

        if (
          !paused &&
          Date.now() -
            lastLevelUp >
            10000
        ) {
          showLevelUp();
        }

        /* GAME OVER */

        if (gameOver) {
          ctx.fillStyle =
            "rgba(0,0,0,0.65)";

          ctx.fillRect(
            0,
            0,
            600,
            400
          );

          ctx.font =
            '26px "Fredoka", sans-serif';

          ctx.fillStyle =
            "white";

          ctx.textAlign =
            "center";

          ctx.fillText(
            "GAME OVER",
            300,
            190
          );

          ctx.font =
            '16px "Fredoka", sans-serif';

          ctx.fillStyle =
            "rgba(255,255,255,0.7)";

          ctx.fillText(
            "Kills: " +
              kills,
            300,
            220
          );

          ctx.textAlign =
            "left";
        }

        requestAnimationFrame(
          loop
        );
      }

      /* ================= SECRET POWERUP ================= */

      let enterUsed = false;

      document.addEventListener(
        "keydown",
        (e) => {
          if (
            e.key === "Enter" &&
            !enterUsed
          ) {
            enterUsed = true;

            requestAnimationFrame(
              () =>
                activateAllPowerups()
            );
          }
        }
      );

      function activateAllPowerups() {
        paused = true;

        powerups.forEach(
          (p) => {
            if (
              !obtained.has(
                p.key
              )
            ) {
              p.effect();

              obtained.add(
                p.key
              );
            }
          }
        );

        chaosLevel = 3;

        const ui =
          document.getElementById(
            "ui"
          );

        ui.innerHTML = "";

        ui.style.display =
          "none";

        lastLevelUp =
          Date.now();

        setTimeout(() => {
          paused = false;
        }, 50);
      }

      /* ================= SECOND ENTER HANDLER ================= */

      let entered = false;

      document.addEventListener(
        "keydown",
        (e) => {
          if (
            e.key === "Enter" &&
            !entered
          ) {
            entered = true;

            activateAllPowerups();
          }
        }
      );

      /* ================= START ================= */

      init();
      loop();
    </script>
  </body>
</html>
