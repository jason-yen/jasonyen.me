<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>jasonyen.me</title>

    <link rel="icon" type="image/png" href="/images/favicon.png" />

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family:
          -apple-system,
          BlinkMacSystemFont,
          "SF Pro Display",
          "Segoe UI",
          sans-serif;
      }

      html {
        min-height: 100%;
        background: #050816;
        scroll-behavior: smooth;
      }

      body {
        min-height: 100vh;
        position: relative;
        isolation: isolate;
        background: #050816;
        color: white;
        overflow-x: hidden;
      }

      /* ================= BACKGROUND ================= */

      body::before {
        content: "";
        position: fixed;
        inset: 0;
        z-index: -2;
        pointer-events: none;

        background:
          radial-gradient(
            circle at 0% 18%,
            rgba(127, 90, 240, 0.95) 0%,
            rgba(127, 90, 240, 0.55) 16%,
            transparent 38%
          ),
          radial-gradient(
            circle at 100% 82%,
            rgba(0, 194, 255, 0.55) 0%,
            transparent 36%
          ),
          linear-gradient(
            135deg,
            #050816 0%,
            #0b1022 48%,
            #0f172a 100%
          );

        background-repeat: no-repeat;
        background-size: cover;
      }

      /* ================= ORBS ================= */

      .orb {
        position: fixed;
        border-radius: 50%;
        filter: blur(60px);
        opacity: 0.35;
        pointer-events: none;
        animation: float 14s ease-in-out infinite alternate;
        z-index: -1;
      }

      .orb1 {
        width: 420px;
        height: 420px;
        top: -120px;
        left: -120px;
        background: #7f5af0;
      }

      .orb2 {
        width: 380px;
        height: 380px;
        bottom: -120px;
        right: -120px;
        background: #00c2ff;
        animation-duration: 18s;
      }

      @keyframes float {
        0% {
          transform: translate(0, 0) scale(1);
        }

        50% {
          transform: translate(60px, -40px) scale(1.15);
        }

        100% {
          transform: translate(-40px, 50px) scale(0.95);
        }
      }

      /* ================= NAVBAR ================= */

      nav {
        width: 100%;
        padding: 24px 7%;

        display: flex;
        justify-content: space-between;
        align-items: center;

        position: fixed;
        top: 0;

        background: rgba(255, 255, 255, 0.05);

        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);

        border-bottom: 1px solid rgba(255, 255, 255, 0.08);

        z-index: 1000;
      }

      .logo {
        font-size: 1.5rem;
        font-weight: 700;
        letter-spacing: 1px;
        color: white;
        white-space: nowrap;
      }

      .nav-links {
        display: flex;
        gap: 32px;
      }

      .nav-links a {
        text-decoration: none;
        color: rgba(255, 255, 255, 0.8);
        font-size: 0.95rem;
        transition: 0.3s;
      }

      .nav-links a:hover {
        color: white;
      }

      /* ================= MAIN CARD ================= */

      .chatbox {
        width: 90%;
        max-width: 1100px;

        margin: 120px auto 50px;

        padding: 60px;

        background: rgba(255, 255, 255, 0.08);

        backdrop-filter: blur(25px);
        -webkit-backdrop-filter: blur(25px);

        border-radius: 60px;

        border: 1px solid rgba(255, 255, 255, 0.12);

        box-shadow:
          0 8px 32px rgba(0, 0, 0, 0.35),
          inset 0 1px 1px rgba(255, 255, 255, 0.1);

        position: relative;
        z-index: 2;
      }

      /* ================= TITLE ================= */

      .page-title {
        font-size: 1.7rem;
        font-weight: 700;
        margin-bottom: 30px;
        color: white;
      }

      /* ================= GAME BOX ================= */

      .game-box {
        position: relative;
        overflow: hidden;

        background: rgba(255, 255, 255, 0.08);

        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);

        border: 1px solid rgba(255, 255, 255, 0.1);

        border-radius: 25px;

        padding: 25px;

        box-shadow:
          0 8px 32px rgba(0, 0, 0, 0.2),
          inset 0 1px 1px rgba(255, 255, 255, 0.05);
      }

      /* ================= INPUT ================= */

      input[type="number"] {
        width: 100%;

        padding: 18px 22px;

        border-radius: 18px;

        border: 1px solid rgba(255, 255, 255, 0.15);

        background: rgba(255, 255, 255, 0.08);

        color: white;

        font-size: 1rem;

        outline: none;

        margin-bottom: 18px;

        font-family:
          -apple-system,
          BlinkMacSystemFont,
          "SF Pro Display",
          "Segoe UI",
          sans-serif;

        transition:
          border 0.25s ease,
          box-shadow 0.25s ease;
      }

      input[type="number"]:focus {
        border-color: rgba(127, 90, 240, 0.7);

        box-shadow:
          0 0 20px rgba(127, 90, 240, 0.2);
      }

      input::placeholder {
        color: rgba(255, 255, 255, 0.5);
      }

      /* ================= BUTTONS ================= */

      button {
        padding: 16px 28px;

        border-radius: 18px;

        border: 1px solid rgba(255, 255, 255, 0.1);

        text-decoration: none;

        font-weight: 600;

        font-size: 1rem;

        font-family:
          -apple-system,
          BlinkMacSystemFont,
          "SF Pro Display",
          "Segoe UI",
          sans-serif;


        background: rgba(255, 255, 255, 0.08);

        color: white;

        transition: 0.35s;

        margin-right: 10px;
      }

      button:hover {
        transform: translateY(-4px) scale(1.04);

        background: rgba(255, 255, 255, 0.15);

        box-shadow:
          0 15px 35px rgba(255, 255, 255, 0.12);
      }

      button:active {
        transform: translateY(-1px) scale(1);
      }

      .reset {
        background: rgba(255, 255, 255, 0.08);
      }

      /* ================= FEEDBACK ================= */

      .feedback {
        margin-top: 22px;

        font-size: 20px;

        font-weight: 600;

        min-height: 28px;

        transition: all 0.25s ease;
      }

      .feedback.win {
        color: #6dff8f;

        text-shadow:
          0 0 18px rgba(109, 255, 143, 0.7);
      }

      .feedback.high {
        color: #ffae8a;

        text-shadow:
          0 0 18px rgba(255, 174, 138, 0.6);
      }

      .feedback.low {
        color: #8fd8ff;

        text-shadow:
          0 0 18px rgba(143, 216, 255, 0.6);
      }

      .attempts {
        margin-top: 10px;

        opacity: 0.65;

        font-size: 15px;

        letter-spacing: 0.3px;
      }


      /* ================= MOBILE ================= */

      @media (max-width: 768px) {
        nav {
          padding: 20px 5%;
        }

        .nav-links {
          display: none;
        }

        .chatbox {
          margin-top: 110px;

          padding: 30px;

          border-radius: 35px;
        }

        .page-title {
          font-size: 1.5rem;
        }

        .game-box {
          padding: 22px;
        }

        button {
          width: 100%;

          margin: 8px 0 0;
        }
      }

      .game-description {
        color: rgba(255, 255, 255, 0.75);
        font-size: 1rem;
        line-height: 1.7;
        margin-bottom: 30px;
      }



    </style>
  </head>

  <body>

    <div class="orb orb1"></div>
    <div class="orb orb2"></div>

    <!-- NAVBAR -->

    <nav>
      <div class="logo">Guess the Number</div>

      <div class="nav-links">
        <a href="/">Main</a>
        <a href="/games">Games</a>
        <a href="/tools">Tools</a>
        <a href="/shuffler">Shuffler</a>
      </div>
    </nav>

    <!-- MAIN -->

    <div class="chatbox">
      <div class="game-description">
        Enter any number between 1 and 100.
      </div>
      <br>
      <div class="page-title">


      <div class="game-box">

        <input
          type="number"
          id="guessInput"
          placeholder="Enter number"
          min="1"
          max="100"
        />

        <button onclick="checkGuess()">
          Guess
        </button>

        <button
          class="reset"
          onclick="startGame()"
        >
          Restart
        </button>

        <div
          class="feedback"
          id="feedback">
        </div>

        <div
          class="attempts"
          id="attempts">
        </div>

      </div>

    </div>


    <script>
      /* ================= GAME LOGIC ================= */

      let randomNumber;
      let attempts;

      const input =
        document.getElementById("guessInput");

      const feedback =
        document.getElementById("feedback");

      const attemptsText =
        document.getElementById("attempts");

      function startGame() {
        randomNumber =
          Math.floor(Math.random() * 100) + 1;

        attempts = 0;

        feedback.textContent = "";

        feedback.className = "feedback";

        attemptsText.textContent = "";

        input.value = "";

        input.focus();
      }

      function checkGuess() {
        const guess = Number(input.value);

        if (
          !guess ||
          guess < 1 ||
          guess > 100
        ) {
          feedback.textContent =
            "Enter a number between 1 and 100";

          feedback.className = "feedback";

          return;
        }

        attempts++;

        if (guess === randomNumber) {
          feedback.textContent =
            `🎉 Correct! ${attempts} attempts`;

          feedback.className =
            "feedback win";

          attemptsText.textContent =
            "New game starting...";

          setTimeout(startGame, 2000);

          return;
        }

        if (guess < randomNumber) {
          feedback.textContent =
            "Too low ↓";

          feedback.className =
            "feedback low";
        } else {
          feedback.textContent =
            "Too high ↑";

          feedback.className =
            "feedback high";
        }

        attemptsText.textContent =
          `Attempts: ${attempts}`;

        input.value = "";

        input.focus();
      }

      input.addEventListener(
        "keydown",
        (e) => {
          if (e.key === "Enter") {
            checkGuess();
          }
        }
      );

      startGame();

      /* ================= CUSTOM CURSOR ================= */

     
    </script>

  </body>
</html>
