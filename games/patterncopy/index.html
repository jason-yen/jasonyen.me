<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>jasonyen.me</title>
    <link rel="icon" type="image/png" href="/images/favicon.png" />

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family:
          -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI",
          sans-serif;
      }

      html {
        min-height: 100%;
        background: #050816;
        scroll-behavior: smooth;
      }

      body {
        min-height: 100vh;
        position: relative;
        isolation: isolate;
        background: #050816;
        color: white;
        overflow-x: hidden;
      }

      /* ================= BACKGROUND ================= */

      body::before {
        content: "";
        position: fixed;
        inset: 0;
        z-index: -2;
        background:
          radial-gradient(
            circle at 0% 18%,
            rgba(127, 90, 240, 0.95),
            rgba(127, 90, 240, 0.55) 18%,
            transparent 38%
          ),
          radial-gradient(
            circle at 100% 82%,
            rgba(0, 194, 255, 0.55),
            transparent 36%
          ),
          linear-gradient(
            135deg,
            #050816 0%,
            #0b1022 50%,
            #0f172a 100%
          );
        background-repeat: no-repeat;
        background-size: cover;
      }

      /* ================= FLOATING ORBS ================= */

      .orb {
        position: fixed;
        width: 420px;
        height: 420px;
        border-radius: 50%;
        filter: blur(60px);
        opacity: 0.35;
        pointer-events: none;
        z-index: -1;
        animation: float 14s ease-in-out infinite alternate;
      }

      .orb1 {
        top: -120px;
        left: -120px;
        background: #7f5af0;
      }

      .orb2 {
        width: 380px;
        height: 380px;
        bottom: -120px;
        right: -120px;
        background: #00c2ff;
        animation-duration: 18s;
      }

      @keyframes float {
        0% {
          transform: translate(0, 0) scale(1);
        }

        50% {
          transform: translate(40px, 30px) scale(1.05);
        }

        100% {
          transform: translate(-20px, 50px) scale(0.98);
        }
      }

      /* ================= NAVBAR ================= */

      nav {
        width: 100%;
        padding: 24px 7%;
        display: flex;
        justify-content: space-between;
        align-items: center;
        position: fixed;
        top: 0;
        background: rgba(255, 255, 255, 0.05);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        z-index: 1000;
      }

      .logo {
        font-size: 1.5rem;
        font-weight: 700;
        letter-spacing: 1px;
        color: white;
        text-decoration: none;
      }

      .nav-links {
        display: flex;
        gap: 32px;
      }

      .nav-links a {
        text-decoration: none;
        color: rgba(255, 255, 255, 0.8);
        font-size: 0.95rem;
        transition: 0.3s;
      }

      .nav-links a:hover {
        color: white;
      }

      /* ================= MAIN CARD ================= */

      .chatbox {
        width: 90%;
        max-width: 1100px;
        margin: 120px auto 50px;
        padding: 60px;
        background: rgba(255, 255, 255, 0.08);
        backdrop-filter: blur(25px);
        -webkit-backdrop-filter: blur(25px);
        border-radius: 60px;
        border: 1px solid rgba(255, 255, 255, 0.12);
        box-shadow:
          0 8px 32px rgba(0, 0, 0, 0.35),
          inset 0 1px 1px rgba(255, 255, 255, 0.1);
        position: relative;
        z-index: 2;
      }

      /* ================= GAME TITLE ================= */

      .game-title {
        font-size: 1.7rem;
        font-weight: 600;
        margin-bottom: 12px;
        color: white;
      }

      .game-description {
        color: rgba(255, 255, 255, 0.75);
        font-size: 1rem;
        line-height: 1.7;
        margin-bottom: 30px;
      }

      /* ================= COUNTDOWN ================= */

      #countdown {
        font-size: 2rem;
        font-weight: 600;
        min-height: 48px;
        margin-bottom: 20px;
        color: white;
        text-shadow: 0 0 18px rgba(127, 90, 240, 0.45);
      }

      /* ================= GAME BOARD ================= */

      #game-board {
        display: grid;
        grid-template-columns: repeat(2, 140px);
        gap: 18px;
        margin: 20px 0 28px;
      }

      .color-btn {
        position: relative;
        overflow: hidden;
        width: 140px;
        height: 140px;
        border-radius: 24px;
        cursor: pointer;
        border: 1px solid rgba(255, 255, 255, 0.18);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        transition:
          transform 0.2s ease,
          filter 0.2s ease,
          opacity 0.2s ease,
          box-shadow 0.25s ease;
      }

      .color-btn:hover {
        transform: translateY(-4px);
        box-shadow: 0 18px 35px rgba(0, 0, 0, 0.3);
      }

      .color-btn::before {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(
          120deg,
          transparent,
          rgba(255, 255, 255, 0.22),
          transparent
        );
        transform: translateX(-120%);
        transition: transform 0.7s ease;
      }

      .color-btn:hover::before {
        transform: translateX(120%);
      }

      #green {
        background: linear-gradient(135deg, #00e676, #00b85c);
      }

      #red {
        background: linear-gradient(135deg, #ff4d73, #ff1744);
      }

      #yellow {
        background: linear-gradient(135deg, #ffe66d, #ffd600);
      }

      #blue {
        background: linear-gradient(135deg, #5c9dff, #2979ff);
      }

      .color-btn.active {
        transform: scale(1.08);
        filter: brightness(1.35);
        box-shadow: 0 0 30px rgba(255, 255, 255, 0.35);
      }

      .color-btn.dim {
        opacity: 0.3;
        transform: scale(0.96);
      }

      /* ================= SCORE ================= */

      #score,
      #highscore {
        font-size: 1rem;
        margin-top: 6px;
        color: white;
      }

      #highscore {
        opacity: 0.72;
      }

      #game-over {
        margin-top: 18px;
        min-height: 28px;
        color: #ff6b81;
        font-weight: 600;
        text-shadow: 0 0 18px rgba(255, 107, 129, 0.35);
      }

      /* ================= BUTTON ================= */

      .game-link {
        position: relative;
        overflow: hidden;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-width: 190px;
        padding: 16px 28px;
        margin-top: 22px;
        border-radius: 18px;
        background: rgba(255, 255, 255, 0.08);
        border: 1px solid rgba(255, 255, 255, 0.1);
        color: white;
        font-size: 1rem;
        font-weight: 600;
        font-family:
          -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI",
          sans-serif;
        cursor: pointer;
        text-decoration: none;
        transition: 0.35s;
      }

      .game-link:hover {
        transform: translateY(-4px) scale(1.04);
        background: rgba(255, 255, 255, 0.15);
        box-shadow: 0 15px 35px rgba(255, 255, 255, 0.12);
      }

      .game-link:active {
        transform: scale(0.98);
      }

      /* ================= MOBILE ================= */

      @media (max-width: 768px) {
        nav {
          padding: 20px 5%;
        }

        .nav-links {
          display: none;
        }

        .chatbox {
          margin-top: 110px;
          padding: 30px;
          border-radius: 35px;
        }

        .game-title {
          font-size: 1.5rem;
        }

        #game-board {
          grid-template-columns: repeat(2, 110px);
          gap: 14px;
        }

        .color-btn {
          width: 110px;
          height: 110px;
          border-radius: 20px;
        }

        .game-link {
          width: 100%;
        }
      }
    </style>
  </head>

  <body>
    <div class="orb orb1"></div>
    <div class="orb orb2"></div>

    <nav>
      <a href="/" class="logo">Copy the Pattern</a>

      <div class="nav-links">
        <a href="/">Main</a>
        <a href="/games">Games</a>
        <a href="/tools">Tools</a>
        <a href="/MP3 Shuffler">MP3 Shuffler</a>
      </div>
    </nav>

    <main class="chatbox">

      <div class="game-description">
        Watch the pattern, then repeat it in the correct order.
      </div>

      <div id="countdown"></div>

      <div id="game-board">
        <div class="color-btn" id="green"></div>
        <div class="color-btn" id="red"></div>
        <div class="color-btn" id="yellow"></div>
        <div class="color-btn" id="blue"></div>
      </div>

      <p id="score">Score: 0</p>
      <p id="highscore">High Score: 0</p>

      <button id="start-btn" class="game-link">
        Start Game
      </button>

      <p id="game-over"></p>
    </main>

    <script>
      /* ================= GAME LOGIC ================= */

      let gameSequence = [];
      let playerSequence = [];
      let score = 0;
      let speed = 700;
      let gameStarted = false;

      const colors = ["green", "red", "yellow", "blue"];

      const buttons = document.querySelectorAll(".color-btn");
      const startButton = document.getElementById("start-btn");
      const scoreDisplay = document.getElementById("score");
      const highscoreDisplay = document.getElementById("highscore");
      const gameOverDisplay = document.getElementById("game-over");
      const countdownDisplay = document.getElementById("countdown");

      let highscore =
        localStorage.getItem("patternHighscore") || 0;

      highscoreDisplay.textContent =
        "High Score: " + highscore;

      startButton.onclick = startCountdown;

      buttons.forEach((button) => {
        button.onclick = handlePlayerClick;
      });

      function startCountdown() {
        startButton.style.display = "none";

        let count = 3;
        countdownDisplay.textContent = count;

        const timer = setInterval(() => {
          count--;

          if (count > 0) {
            countdownDisplay.textContent = count;
          } else if (count === 0) {
            countdownDisplay.textContent = "GO!";
          } else {
            clearInterval(timer);
            countdownDisplay.textContent = "";
            startGame();
          }
        }, 800);
      }

      function startGame() {
        gameStarted = true;
        gameSequence = [];
        playerSequence = [];
        score = 0;
        speed = 700;

        scoreDisplay.textContent = "Score: 0";
        gameOverDisplay.textContent = "";

        nextRound();
      }

      function nextRound() {
        playerSequence = [];
        speed = Math.max(250, speed - 15);

        const randomColor =
          colors[Math.floor(Math.random() * 4)];

        gameSequence.push(randomColor);

        playSequence();
      }

      function playSequence() {
        let i = 0;

        buttons.forEach((b) => {
          b.disabled = true;
        });

        const interval = setInterval(() => {
          flashButton(gameSequence[i]);

          i++;

          if (i >= gameSequence.length) {
            clearInterval(interval);

            buttons.forEach((b) => {
              b.disabled = false;
            });
          }
        }, speed);
      }

      function flashButton(color) {
        const button = document.getElementById(color);

        buttons.forEach((b) => {
          if (b.id !== color) {
            b.classList.add("dim");
          }
        });

        button.classList.add("active");

        setTimeout(() => {
          button.classList.remove("active");

          buttons.forEach((b) => {
            b.classList.remove("dim");
          });
        }, speed * 0.6);
      }

      function handlePlayerClick(e) {
        if (!gameStarted) return;

        const color = e.currentTarget.id;

        playerSequence.push(color);

        flashButton(color);
        checkPlayerSequence();
      }

      function checkPlayerSequence() {
        for (let i = 0; i < playerSequence.length; i++) {
          if (playerSequence[i] !== gameSequence[i]) {
            gameOver();
            return;
          }
        }

        if (playerSequence.length === gameSequence.length) {
          score++;

          scoreDisplay.textContent =
            "Score: " + score;

          setTimeout(nextRound, 800);
        }
      }

      function gameOver() {
        gameStarted = false;

        if (score > highscore) {
          highscore = score;

          localStorage.setItem(
            "patternHighscore",
            highscore
          );

          highscoreDisplay.textContent =
            "High Score: " + highscore;
        }

        gameOverDisplay.textContent =
          "Game Over! Score: " + score;

        startButton.style.display = "inline-flex";
      }
    </script>
  </body>
</html>
