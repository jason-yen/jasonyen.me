<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>jasonyen.me</title>

    <link
      href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&display=swap"
      rel="stylesheet"
    />

    <link
      href="https://fonts.googleapis.com/css2?family=Spectral:wght@400;500;600&display=swap"
      rel="stylesheet"
    />

    <link rel="icon" type="image/png" href="/images/favicon.png" />

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family:
          -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI",
          sans-serif;
      }

      html {
        min-height: 100%;
        background: #050816;
        scroll-behavior: smooth;
      }

      body {
        min-height: 100vh;
        position: relative;
        isolation: isolate;
        background: #050816;
        color: white;
        overflow-x: hidden;
      }

      /* ================= BACKGROUND ================= */

      body::before {
        content: "";
        position: fixed;
        inset: 0;
        z-index: -2;
        pointer-events: none;
        background:
          radial-gradient(
            circle at 0% 18%,
            rgba(127, 90, 240, 0.95) 0%,
            rgba(127, 90, 240, 0.55) 16%,
            transparent 38%
          ),
          radial-gradient(
            circle at 100% 82%,
            rgba(0, 194, 255, 0.55) 0%,
            transparent 36%
          ),
          linear-gradient(
            135deg,
            #050816 0%,
            #0b1022 48%,
            #0f172a 100%
          );
        background-repeat: no-repeat;
        background-size: cover;
      }

      /* ================= ORBS ================= */

      .orb {
        position: fixed;
        border-radius: 50%;
        filter: blur(60px);
        opacity: 0.35;
        pointer-events: none;
        animation: float 14s ease-in-out infinite alternate;
      }

      .orb1 {
        width: 420px;
        height: 420px;
        top: -120px;
        left: -120px;
        background: #7f5af0;
      }

      .orb2 {
        width: 380px;
        height: 380px;
        bottom: -120px;
        right: -120px;
        background: #00c2ff;
        animation-duration: 18s;
      }

      @keyframes float {
        0% {
          transform: translate(0, 0) scale(1);
        }

        50% {
          transform: translate(60px, -40px) scale(1.15);
        }

        100% {
          transform: translate(-40px, 50px) scale(0.95);
        }
      }

      /* ================= NAVBAR ================= */

      nav {
        width: 100%;
        padding: 24px 7%;
        display: flex;
        justify-content: space-between;
        align-items: center;
        position: fixed;
        top: 0;
        background: rgba(255, 255, 255, 0.05);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        z-index: 1000;
      }

      .logo {
        font-size: 1.5rem;
        font-weight: 700;
        letter-spacing: 1px;
      }

      .nav-links {
        display: flex;
        gap: 32px;
      }

      .nav-links a {
        text-decoration: none;
        color: rgba(255, 255, 255, 0.8);
        font-size: 0.95rem;
        transition: 0.3s;
      }

      .nav-links a:hover {
        color: white;
      }

      /* ================= RADIO CARD ================= */

      .chatbox {
        width: 90%;
        max-width: 1100px;
        margin: 120px auto 50px;
        padding: 60px;
        background: rgba(255, 255, 255, 0.08);
        backdrop-filter: blur(25px);
        -webkit-backdrop-filter: blur(25px);
        border-radius: 60px;
        border: 1px solid rgba(255, 255, 255, 0.12);
        box-shadow:
          0 8px 32px rgba(0, 0, 0, 0.35),
          inset 0 1px 1px rgba(255, 255, 255, 0.1);
        position: relative;
        z-index: 2;
      }

      /* ================= TITLE ================= */

      .radio-title {
        text-align: center;
        margin-bottom: 50px;
      }

      .radio-title h1 {
        font-size: clamp(38px, 6vw, 64px);
        line-height: 1.1;
        letter-spacing: -1px;
        margin-bottom: 20px;
        background: linear-gradient(
          135deg,
          #7f5af0,
          #00c2ff,
          #ffffff
        );
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-size: 200%;
        animation: titleGradient 6s ease infinite;
      }

      @keyframes titleGradient {
        0%,
        100% {
          background-position: 0% 50%;
        }

        50% {
          background-position: 100% 50%;
        }
      }

      .radio-title p {
        color: rgba(255, 255, 255, 0.65);
        line-height: 1.8;
        font-family: "Spectral", serif;
        font-size: 16px;
      }

      /* ================= STATIONS ================= */

      .stations {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 20px;
      }

      .station {
        padding: 30px;
        background: rgba(255, 255, 255, 0.08);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 30px;
        transition:
          transform 0.35s,
          background 0.35s,
          box-shadow 0.35s;
      }

      .station:hover {
        transform: translateY(-6px);
        background: rgba(255, 255, 255, 0.12);
        box-shadow: 0 15px 35px rgba(0, 0, 0, 0.25);
      }

      .station-number {
        color: rgba(255, 255, 255, 0.45);
        font-size: 13px;
        margin-bottom: 15px;
        letter-spacing: 1px;
      }

      .station h2 {
        font-size: 24px;
        margin-bottom: 10px;
        font-weight: 600;
      }

      .station p {
        color: rgba(255, 255, 255, 0.6);
        font-family: "Spectral", serif;
        line-height: 1.6;
        margin-bottom: 25px;
      }

      /* ================= BUTTONS ================= */

      .controls {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
      }

      .game-link {
        padding: 16px 28px;
        border-radius: 18px;
        text-decoration: none;
        font-weight: 600;
        cursor: pointer;
        background: rgba(255, 255, 255, 0.08);
        border: 1px solid rgba(255, 255, 255, 0.1);
        color: white;
        transition: 0.35s;
      }

      .game-link:hover {
        transform: translateY(-4px) scale(1.04);
        background: rgba(255, 255, 255, 0.15);
        box-shadow: 0 15px 35px rgba(255, 255, 255, 0.12);
      }

      /* ================= STATUS ================= */

      .status {
        min-height: 24px;
        margin-top: 18px;
        color: rgba(255, 255, 255, 0.55);
        font-size: 14px;
      }

      .status.playing {
        color: #00c2ff;
      }

      /* ================= VISUALIZER ================= */

      .visualizer {
        height: 30px;
        display: flex;
        align-items: center;
        gap: 4px;
        margin-bottom: 20px;
      }

      .visualizer span {
        width: 4px;
        height: 5px;
        border-radius: 10px;
        background: white;
        opacity: 0.4;
      }

      .station.active .visualizer span {
        animation: equalizer 0.7s ease-in-out infinite alternate;
      }

      .station.active .visualizer span:nth-child(2) {
        animation-delay: 0.1s;
      }

      .station.active .visualizer span:nth-child(3) {
        animation-delay: 0.2s;
      }

      .station.active .visualizer span:nth-child(4) {
        animation-delay: 0.3s;
      }

      .station.active .visualizer span:nth-child(5) {
        animation-delay: 0.4s;
      }

      @keyframes equalizer {
        from {
          height: 5px;
          opacity: 0.4;
        }

        to {
          height: 28px;
          opacity: 1;
        }
      }

      /* ================= MOBILE ================= */

      @media (max-width: 900px) {
        .stations {
          grid-template-columns: 1fr;
        }
      }

      @media (max-width: 768px) {
        nav {
          padding: 20px 5%;
        }

        .nav-links {
          display: none;
        }

        .chatbox {
          margin-top: 110px;
          padding: 30px;
          border-radius: 35px;
        }

        .stations {
          grid-template-columns: 1fr;
        }
      }

      @media (max-width: 500px) {
        .station {
          padding: 25px;
        }

        .controls {
          flex-direction: column;
        }

        .game-link {
          width: 100%;
          text-align: center;
        }
      }
    </style>
  </head>

  <body>
    <div class="orb orb1"></div>
    <div class="orb orb2"></div>

    <!-- NAVBAR -->

    <nav>
      <div class="logo">Radio</div>

      <div class="nav-links">
        <a href="/">Main</a>
        <a href="/games">Games</a>
        <a href="/tools">Tools</a>
        <a href="/radio">Radio</a>
      </div>
    </nav>

    <!-- RADIO -->

    <div class="chatbox">
      <div class="radio-title"></div>

      <div class="stations">

        <!-- KOST -->

        <div class="station" id="station1">
          <div class="station-number">
            STATION 01
          </div>

          <h2>KOST 103.5</h2>

          <p>
            Listen to KOST 103.5 live.
          </p>

          <div class="visualizer">
            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>
          </div>

          <div class="controls">
            <button
              class="game-link"
              onclick="playRadio(1)"
            >
              Play
            </button>

            <button
              class="game-link"
              onclick="stopRadio(1)"
            >
              Stop
            </button>
          </div>

          <div class="status" id="status1"></div>

          <audio
            id="radio1"
            preload="none"
            src="https://cloud.revma.ihrhls.com/zc193?rj-org=n2eb-e2&rj-ttl=5&rj-tok=AAABnmI_1H8AOfzxahGBF4-2-Q"
          ></audio>
        </div>

        <!-- KIIS -->

        <div class="station" id="station3">
          <div class="station-number">
            STATION 02
          </div>

          <h2>102.7 KIIS-FM</h2>

          <p>
            Listen to 102.7 KIIS-FM live.
          </p>

          <div class="visualizer">
            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>
          </div>

          <div class="controls">
            <button
              class="game-link"
              onclick="playRadio(3)"
            >
              Play
            </button>

            <button
              class="game-link"
              onclick="stopRadio(3)"
            >
              Stop
            </button>
          </div>

          <div class="status" id="status3"></div>

          <audio
            id="radio3"
            preload="none"
            src="https://cloud.revma.ihrhls.com/zc185?rj-org=n0bb-e2&rj-ttl=5&rj-tok=AAABnmyXXDgApHYh19TuszW5BA"
          ></audio>
        </div>

      </div>
    </div>

    <script>
      const radios = {
        1: document.getElementById("radio1"),
        3: document.getElementById("radio3")
      };

      const stations = {
        1: document.getElementById("station1"),
        3: document.getElementById("station3")
      };

      const statuses = {
        1: document.getElementById("status1"),
        3: document.getElementById("status3")
      };

      function stopAll() {
        Object.keys(radios).forEach((id) => {
          radios[id].pause();
          stations[id].classList.remove("active");
          statuses[id].classList.remove("playing");
          statuses[id].textContent = "";
        });
      }

      function playRadio(id) {
        stopAll();

        const radio = radios[id];

        radio
          .play()
          .then(() => {
            stations[id].classList.add("active");
            statuses[id].classList.add("playing");
            statuses[id].textContent = "Now playing";
          })
          .catch(() => {
            statuses[id].textContent =
              "Unable to play this station.";
          });
      }

      function stopRadio(id) {
        const radio = radios[id];

        radio.pause();

        try {
          radio.currentTime = 0;
        } catch {}

        stations[id].classList.remove("active");
        statuses[id].classList.remove("playing");
        statuses[id].textContent = "";
      }

      Object.keys(radios).forEach((id) => {
        radios[id].addEventListener("ended", () => {
          stations[id].classList.remove("active");
          statuses[id].classList.remove("playing");
          statuses[id].textContent = "";
        });
      });
    </script>
  </body>
</html>
