<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>jasonyen.me</title>

    <link rel="icon" type="image/png" href="/images/favicon.png" />

    <style>
      /* ================= GLOBAL ================= */

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family:
          -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI",
          sans-serif;
      }

      html {
        min-height: 100%;
        background: #050816;
        scroll-behavior: smooth;
      }

      body {
        min-height: 100vh;
        position: relative;
        isolation: isolate;
        background: #050816;
        color: white;
        overflow-x: hidden;
      }

      /* ================= BACKGROUND ================= */

      body::before {
        content: "";
        position: fixed;
        inset: 0;
        z-index: -2;
        background:
          radial-gradient(
            circle at 0% 18%,
            rgba(127, 90, 240, 0.95),
            rgba(127, 90, 240, 0.55) 18%,
            transparent 38%
          ),
          radial-gradient(
            circle at 100% 82%,
            rgba(0, 194, 255, 0.55),
            transparent 36%
          ),
          linear-gradient(
            135deg,
            #050816 0%,
            #0b1022 50%,
            #0f172a 100%
          );
        background-repeat: no-repeat;
        background-size: cover;
      }

      /* ================= FLOATING ORBS ================= */

      .orb {
        position: fixed;
        width: 420px;
        height: 420px;
        border-radius: 50%;
        filter: blur(60px);
        opacity: 0.35;
        pointer-events: none;
        z-index: -1;
        animation: float 14s ease-in-out infinite alternate;
      }

      .orb1 {
        top: -120px;
        left: -120px;
        background: #7f5af0;
      }

      .orb2 {
        width: 380px;
        height: 380px;
        bottom: -120px;
        right: -120px;
        background: #00c2ff;
        animation-duration: 18s;
      }

      @keyframes float {
        0% {
          transform: translate(0, 0) scale(1);
        }

        50% {
          transform: translate(40px, 30px) scale(1.05);
        }

        100% {
          transform: translate(-20px, 50px) scale(0.98);
        }
      }

      /* ================= NAVBAR ================= */

      nav {
        width: 100%;
        padding: 24px 7%;
        display: flex;
        justify-content: space-between;
        align-items: center;
        position: fixed;
        top: 0;
        background: rgba(255, 255, 255, 0.05);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        z-index: 1000;
      }

      .logo {
        font-size: 1.5rem;
        font-weight: 700;
        letter-spacing: 1px;
        color: white;
        text-decoration: none;
      }

      .nav-links {
        display: flex;
        gap: 32px;
      }

      .nav-links a {
        text-decoration: none;
        color: rgba(255, 255, 255, 0.8);
        font-size: 0.95rem;
        transition: 0.3s;
      }

      .nav-links a:hover {
        color: white;
      }

      /* ================= MAIN GLASS CARD ================= */

      .chatbox {
        width: 90%;
        max-width: 1100px;
        margin: 120px auto 50px;
        padding: 60px;
        background: rgba(255, 255, 255, 0.08);
        backdrop-filter: blur(25px);
        -webkit-backdrop-filter: blur(25px);
        border-radius: 60px;
        border: 1px solid rgba(255, 255, 255, 0.12);
        box-shadow:
          0 8px 32px rgba(0, 0, 0, 0.35),
          inset 0 1px 1px rgba(255, 255, 255, 0.1);
        position: relative;
        z-index: 2;
      }

      /* ================= HEADING ================= */

      h1 {
        font-size: 1.7rem;
        line-height: 1.2;
        font-weight: 600;
        margin-bottom: 12px;
        color: white;
      }

      .about-me {
        color: rgba(255, 255, 255, 0.7);
        font-size: 0.95rem;
        line-height: 1.6;
        margin-bottom: 28px;
      }

      /* ================= TEXT BOX ================= */

      #inputText {
        width: 100%;
        min-height: 180px;
        padding: 18px 20px;
        margin-bottom: 18px;
        border-radius: 22px;
        border: 1px solid rgba(255, 255, 255, 0.12);
        background: rgba(0, 0, 0, 0.18);
        backdrop-filter: blur(18px);
        -webkit-backdrop-filter: blur(18px);
        font-size: 16px;
        line-height: 1.7;
        color: white;
        resize: vertical;
        outline: none;
        box-shadow:
          0 10px 30px rgba(0, 0, 0, 0.18),
          inset 0 1px 0 rgba(255, 255, 255, 0.05);
        transition:
          border 0.3s ease,
          box-shadow 0.3s ease,
          transform 0.25s ease,
          background 0.3s ease;
      }

      #inputText::placeholder {
        color: rgba(255, 255, 255, 0.4);
        font-size: 15px;
      }

      #inputText:hover {
        transform: translateY(-2px);
        box-shadow:
          0 16px 40px rgba(0, 0, 0, 0.25),
          inset 0 1px 0 rgba(255, 255, 255, 0.06);
      }

      #inputText:focus {
        border: 1px solid rgba(127, 90, 240, 0.7);
        background: rgba(0, 0, 0, 0.25);
        box-shadow:
          0 0 0 4px rgba(127, 90, 240, 0.12),
          0 18px 45px rgba(0, 0, 0, 0.3);
      }

      /* ================= BUTTONS ================= */

      .button-row {
        display: flex;
        gap: 14px;
        flex-wrap: wrap;
        margin-top: 10px;
      }

      .game-link {
        padding: 16px 28px;
        border-radius: 18px;
        background: rgba(255, 255, 255, 0.08);
        border: 1px solid rgba(255, 255, 255, 0.1);
        color: white;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
        transition: 0.35s;
      }

      .game-link:hover {
        transform: translateY(-4px) scale(1.04);
        background: rgba(255, 255, 255, 0.15);
        box-shadow: 0 15px 35px rgba(255, 255, 255, 0.12);
      }

      .game-link:active {
        transform: translateY(-1px) scale(1.01);
      }

      /* ================= RESULT ================= */

      .result-container {
        margin-top: 32px;
      }

      .result-container h3 {
        margin-bottom: 12px;
        font-size: 1rem;
        color: white;
        font-weight: 600;
      }

      #outputText {
        margin-top: 0;
        padding: 18px 20px;
        min-height: 70px;
        border-radius: 18px;
        background: rgba(0, 0, 0, 0.18);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border: 1px solid rgba(255, 255, 255, 0.1);
        color: rgba(255, 255, 255, 0.9);
        line-height: 1.7;
        box-shadow:
          0 8px 24px rgba(0, 0, 0, 0.18),
          inset 0 1px 0 rgba(255, 255, 255, 0.04);
        word-break: break-word;
      }

      /* ================= MOBILE ================= */

      @media (max-width: 768px) {
        nav {
          padding: 20px 5%;
        }

        .nav-links {
          display: none;
        }

        .chatbox {
          margin-top: 110px;
          padding: 30px;
          border-radius: 35px;
        }

        h1 {
          font-size: 1.5rem;
        }

        .button-row {
          flex-direction: column;
        }

        .game-link {
          width: 100%;
        }

        #inputText {
          min-height: 150px;
          padding: 16px;
          font-size: 15px;
          border-radius: 18px;
        }
      }
    </style>
  </head>

  <body>
    <div class="orb orb1"></div>
    <div class="orb orb2"></div>

    <!-- NAVBAR -->
    <nav>
      <a href="/" class="logo">Encoder / Decoder</a>

      <div class="nav-links">
        <a href="/">Main</a>
        <a href="/games">Games</a>
        <a href="/tools">Tools</a>
        <a href="/radio">Radio</a>
      </div>
    </nav>

    <!-- MAIN TOOL -->
    <main class="chatbox">

      <p class="about-me">
        Transform text into a custom encrypted format and decode it instantly.
      </p>

      <textarea
        id="inputText"
        placeholder="Type or paste text here..."
      ></textarea>

      <div class="button-row">
        <button class="game-link" onclick="encodeText">
          Encode Text
        </button>

        <button class="game-link" onclick="decodeText">
          Decode Text
        </button>
      </div>

      <div class="result-container">
        <h3>Result</h3>

        <div id="outputText">
          Your encoded or decoded text will appear here...
        </div>
      </div>
    </main>

    <script>
      /* ================= CIPHER ================= */

      function swapChar(ch) {
        let c = ch.charCodeAt(0);

        if (c >= 97 && c <= 122) {
          return String.fromCharCode(c % 2 === 0 ? c - 1 : c + 1);
        }

        if (c >= 65 && c <= 90) {
          return String.fromCharCode(c % 2 === 0 ? c - 1 : c + 1);
        }

        return ch;
      }

      const map = {
        a: "!",
        b: "@",
        c: "#",
        d: "$",
        e: "%",
        f: "^",
        g: "&",
        h: "*",
        i: "(",
        j: ")",
        k: "-",
        l: "_",
        m: "=",
        n: "+",
        o: "[",
        p: "]",
        q: "{",
        r: "}",
        s: ";",
        t: ":",
        u: "'",
        v: '"',
        w: "<",
        x: ">",
        y: "?",
        z: "/",
      };

      const rev = Object.fromEntries(
        Object.entries(map).map(([k, v]) => [v, k])
      );

      const flip = {
        "!": "¡",
        "¡": "!",
        "?": "¿",
        "¿": "?",
        "(": ")",
        ")": "(",
        "<": ">",
        ">": "<",
        "[": "]",
        "]": "[",
        "{": "}",
        "}": "{",
        "/": "\\",
        "\\": "/",
      };

      const f = (c) => flip[c] || c;

      const revWords = (t) =>
        t
          .split(" ")
          .map((w) => w.split("").reverse().join(""))
          .join(" ");

      /* ================= ENCODE ================= */

      function encodeText() {
        let input = document.getElementById("inputText").value.toLowerCase();

        let reversed = revWords(input);
        let t = "";

        for (let ch of reversed) {
          let s = swapChar(ch);
          t += f(map[s] || ch);
        }

        document.getElementById("outputText").textContent = t;
      }

      /* ================= DECODE ================= */

      function decodeText() {
        let input = document.getElementById("inputText").value;
        let temp = "";

        for (let ch of input) {
          let l = rev[f(ch)];
          temp += l ? swapChar(l) : ch;
        }

        let result = revWords(temp);

        document.getElementById("outputText").textContent = result;
      }

      /* ================= BUTTON EVENTS ================= */

      document
        .querySelectorAll(".game-link")[0]
        .addEventListener("click", encodeText);

      document
        .querySelectorAll(".game-link")[1]
        .addEventListener("click", decodeText);
    </script>
  </body>
</html>
