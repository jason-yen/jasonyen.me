    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family:
          -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI",
          sans-serif;
      }

      html {
        min-height: 100%;
        background: #050816;
        scroll-behavior: smooth;
      }

      body {
        min-height: 100vh;
        position: relative;
        isolation: isolate;
        background: #050816;
        color: white;
        overflow-x: hidden;
      }

      /* ================= BACKGROUND ================= */

      body::before {
        content: "";
        position: fixed;
        inset: 0;
        z-index: -2;
        pointer-events: none;

        background:
          radial-gradient(
            circle at 0% 18%,
            rgba(127, 90, 240, 0.95) 0%,
            rgba(127, 90, 240, 0.55) 16%,
            transparent 38%
          ),
          radial-gradient(
            circle at 100% 82%,
            rgba(0, 194, 255, 0.55) 0%,
            transparent 36%
          ),
          linear-gradient(135deg, #050816 0%, #0b1022 48%, #0f172a 100%);

        background-repeat: no-repeat;
        background-size: cover;
      }

      /* ================= ORBS ================= */

      .orb {
        position: fixed;
        border-radius: 50%;
        filter: blur(60px);
        opacity: 0.35;
        pointer-events: none;
        animation: float 14s ease-in-out infinite alternate;
      }

      .orb1 {
        width: 420px;
        height: 420px;
        top: -120px;
        left: -120px;
        background: #7f5af0;
      }

      .orb2 {
        width: 380px;
        height: 380px;
        bottom: -120px;
        right: -120px;
        background: #00c2ff;
        animation-duration: 18s;
      }

      @keyframes float {
        0% {
          transform: translate(0, 0) scale(1);
        }

        50% {
          transform: translate(60px, -40px) scale(1.15);
        }

        100% {
          transform: translate(-40px, 50px) scale(0.95);
        }
      }

      /* ================= NAVBAR ================= */

      nav {
        width: 100%;
        padding: 24px 7%;

        display: flex;
        justify-content: space-between;
        align-items: center;

        position: fixed;
        top: 0;

        background: rgba(255, 255, 255, 0.05);

        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);

        border-bottom: 1px solid rgba(255, 255, 255, 0.08);

        z-index: 1000;
      }

      .logo {
        font-size: 1.5rem;
        font-weight: 700;
        letter-spacing: 1px;
      }

      .nav-links {
        display: flex;
        gap: 32px;
      }

      .nav-links a {
        text-decoration: none;
        color: rgba(255, 255, 255, 0.8);
        font-size: 0.95rem;
        transition: 0.3s;
      }

      .nav-links a:hover {
        color: white;
      }

      /* ================= MAIN CARD ================= */

      .tools-card {
        width: 90%;
        max-width: 1100px;

        margin: 120px auto 50px;

        padding: 45px 60px 60px;

        background: rgba(255, 255, 255, 0.08);

        backdrop-filter: blur(25px);
        -webkit-backdrop-filter: blur(25px);

        border-radius: 60px;

        border: 1px solid rgba(255, 255, 255, 0.12);

        box-shadow:
          0 8px 32px rgba(0, 0, 0, 0.35),
          inset 0 1px 1px rgba(255, 255, 255, 0.1);

        position: relative;
        z-index: 2;
      }

      /* ================= TITLE ================= */

      .page-title {
        font-size: 1.45rem;
        font-weight: 600;
        margin-bottom: 8px;
      }

      .page-subtitle {
        color: rgba(255, 255, 255, 0.55);
        font-size: 0.95rem;
        margin-bottom: 35px;
      }

      /* ================= TOOL AREA ================= */

      .tool-section {
        padding: 25px;

        background: rgba(255, 255, 255, 0.06);

        border: 1px solid rgba(255, 255, 255, 0.1);

        border-radius: 25px;
      }

      .tool-section-title {
        display: block;

        font-size: 1.15rem;
        font-weight: 600;

        margin-bottom: 20px;
      }

      /* ================= TOOL GRID ================= */

      .tools-grid {
        display: grid;

        grid-template-columns: repeat(2, 1fr);

        gap: 15px;
      }

      /* ================= TOOL BUTTONS ================= */

      .tool-link {
        min-height: 58px;

        display: flex;
        align-items: center;
        justify-content: center;

        padding: 16px 28px;

        border-radius: 18px;

        text-decoration: none;

        font-size: 0.9rem;
        font-weight: 400;

        cursor: pointer;

        background: rgba(255, 255, 255, 0.08);

        border: 1px solid rgba(255, 255, 255, 0.1);

        color: white;

        transition: 0.35s;
      }

      .tool-link:hover {
        transform: translateY(-4px) scale(1.04);

        background: rgba(255, 255, 255, 0.15);

        box-shadow: 0 15px 35px rgba(255, 255, 255, 0.12);
      }

      /* ================= MOBILE ================= */

      @media (max-width: 768px) {
        nav {
          padding: 20px 5%;
        }

        .nav-links {
          display: none;
        }

        .tools-card {
          width: 92%;

          margin-top: 110px;

          padding: 30px;

          border-radius: 35px;
        }

        .page-title {
          font-size: 1.3rem;
        }

        .tools-grid {
          grid-template-columns: 1fr;
        }

        .tool-section {
          padding: 18px;
          border-radius: 22px;
        }

        .tool-link {
          min-height: 54px;
        }
      }
    </style>
