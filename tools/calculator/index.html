<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>jasonyen.me</title>

    <link rel="icon" type="image/png" href="/images/favicon.png" />

    <style>
      /* ================= GLOBAL ================= */

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family:
          -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI",
          sans-serif;
      }

      html {
        min-height: 100%;
        background: #050816;
        scroll-behavior: smooth;
      }

      body {
        min-height: 100vh;
        position: relative;
        isolation: isolate;
        background: #050816;
        color: white;
        overflow-x: hidden;
      }

      /* ================= BACKGROUND ================= */

      body::before {
        content: "";
        position: fixed;
        inset: 0;
        z-index: -2;

        background:
          radial-gradient(
            circle at 0% 18%,
            rgba(127, 90, 240, 0.95),
            rgba(127, 90, 240, 0.55) 18%,
            transparent 38%
          ),
          radial-gradient(
            circle at 100% 82%,
            rgba(0, 194, 255, 0.55),
            transparent 36%
          ),
          linear-gradient(
            135deg,
            #050816 0%,
            #0b1022 50%,
            #0f172a 100%
          );

        background-repeat: no-repeat;
        background-size: cover;
      }

      /* ================= FLOATING ORBS ================= */

      .orb {
        position: fixed;
        width: 420px;
        height: 420px;
        border-radius: 50%;
        filter: blur(60px);
        opacity: 0.35;
        pointer-events: none;
        z-index: -1;
        animation: float 14s ease-in-out infinite alternate;
      }

      .orb1 {
        top: -120px;
        left: -120px;
        background: #7f5af0;
      }

      .orb2 {
        width: 380px;
        height: 380px;
        bottom: -120px;
        right: -120px;
        background: #00c2ff;
        animation-duration: 18s;
      }

      @keyframes float {
        0% {
          transform: translate(0, 0) scale(1);
        }

        50% {
          transform: translate(40px, 30px) scale(1.05);
        }

        100% {
          transform: translate(-20px, 50px) scale(0.98);
        }
      }

      /* ================= NAVBAR ================= */

      nav {
        width: 100%;
        padding: 24px 7%;

        display: flex;
        justify-content: space-between;
        align-items: center;

        position: fixed;
        top: 0;

        background: rgba(255, 255, 255, 0.05);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);

        border-bottom: 1px solid rgba(255, 255, 255, 0.08);

        z-index: 1000;
      }

      .logo {
        font-size: 1.5rem;
        font-weight: 700;
        letter-spacing: 1px;
        color: white;
        text-decoration: none;
      }

      .nav-links {
        display: flex;
        gap: 32px;
      }

      .nav-links a {
        text-decoration: none;
        color: rgba(255, 255, 255, 0.8);
        font-size: 0.95rem;
        transition: 0.3s;
      }

      .nav-links a:hover {
        color: white;
      }

      /* ================= MAIN CARD ================= */

      .chatbox {
        width: 90%;
        max-width: 1100px;

        margin: 120px auto 50px;
        padding: 60px;

        background: rgba(255, 255, 255, 0.08);
        backdrop-filter: blur(25px);
        -webkit-backdrop-filter: blur(25px);

        border-radius: 60px;
        border: 1px solid rgba(255, 255, 255, 0.12);

        box-shadow:
          0 8px 32px rgba(0, 0, 0, 0.35),
          inset 0 1px 1px rgba(255, 255, 255, 0.1);

        position: relative;
        z-index: 2;
      }

      /* ================= TITLE ================= */

      h1 {
        font-size: 1.7rem;
        line-height: 1.2;
        font-weight: 600;
        color: white;
        margin-bottom: 28px;
      }

      /* ================= CALCULATOR ================= */

      .calc-box {
        width: 100%;
        max-width: 700px;
      }

      .calc-input {
        width: 100%;

        padding: 16px 18px;

        border-radius: 18px;
        border: 1px solid rgba(255, 255, 255, 0.1);

        outline: none;

        font-size: 1rem;
        font-family:
          -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI",
          sans-serif;

        background: rgba(255, 255, 255, 0.08);
        color: white;

        box-shadow:
          inset 0 1px 1px rgba(255, 255, 255, 0.05),
          0 8px 25px rgba(0, 0, 0, 0.12);

        transition:
          border 0.25s ease,
          background 0.25s ease,
          box-shadow 0.25s ease;
      }

      .calc-input::placeholder {
        color: rgba(255, 255, 255, 0.45);
      }

      .calc-input:focus {
        background: rgba(255, 255, 255, 0.11);
        border-color: rgba(255, 255, 255, 0.2);

        box-shadow:
          0 0 0 3px rgba(127, 90, 240, 0.15),
          0 10px 30px rgba(0, 0, 0, 0.18);
      }

      /* ================= BUTTONS ================= */

      .button-row {
        display: flex;
        gap: 14px;
        margin-top: 18px;
        flex-wrap: wrap;
      }

      .game-link {
        padding: 16px 28px;

        border-radius: 18px;

        background: rgba(255, 255, 255, 0.08);
        border: 1px solid rgba(255, 255, 255, 0.1);

        color: white;

        font-weight: 600;

        font-family:
          -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI",
          sans-serif;

        cursor: pointer;

        transition: 0.35s;
      }

      .game-link:hover {
        transform: translateY(-4px) scale(1.04);

        background: rgba(255, 255, 255, 0.15);

        box-shadow: 0 15px 35px rgba(255, 255, 255, 0.12);
      }

      .game-link:active {
        transform: translateY(-1px) scale(1.01);
      }

      /* ================= RESULT ================= */

      #result {
        margin-top: 22px;

        padding: 16px 18px;

        border-radius: 18px;

        background: rgba(255, 255, 255, 0.06);
        border: 1px solid rgba(255, 255, 255, 0.08);

        color: rgba(255, 255, 255, 0.85);

        font-size: 1rem;
        font-weight: 500;

        min-height: 58px;

        display: flex;
        align-items: center;

        box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.05);
      }

      /* ================= MOBILE ================= */

      @media (max-width: 768px) {
        nav {
          padding: 20px 5%;
        }

        .nav-links {
          display: none;
        }

        .chatbox {
          margin-top: 110px;
          padding: 30px;
          border-radius: 35px;
        }

        h1 {
          font-size: 1.5rem;
        }

        .button-row {
          flex-direction: column;
        }

        .game-link {
          width: 100%;
        }
      }
    </style>
  </head>

  <body>
    <!-- ================= BACKGROUND ================= -->

    <div class="orb orb1"></div>
    <div class="orb orb2"></div>

    <!-- ================= NAVBAR ================= -->

    <nav>
      <a href="/" class="logo">Calculator</a>

      <div class="nav-links">
        <a href="/">Main</a>
        <a href="/games">Games</a>
        <a href="/tools">Tools</a>
        <a href="/shuffler">shuffler</a>
      </div>
    </nav>

    <!-- ================= MAIN ================= -->

    <main class="chatbox">

      <div class="calc-box">
        <input
          type="text"
          id="calc"
          class="calc-input"
          placeholder="e.g. sin(45), sqrt(9), 2+2"
          autocomplete="off"
        />

        <div class="button-row">
          <button class="game-link" onclick="calculate()">
            Calculate
          </button>

          <button class="game-link" onclick="clearCalc()">
            Clear
          </button>
        </div>

        <p id="result">Waiting for input...</p>
      </div>
    </main>

    <!-- ================= CALCULATOR ================= -->

    <script>
      function calculate() {
        let val = document.getElementById("calc").value.trim();

        if (!val) {
          document.getElementById("result").textContent =
            "Waiting for input...";
          return;
        }

        try {
          val = val
            .replace(/sin/g, "Math.sin")
            .replace(/cos/g, "Math.cos")
            .replace(/tan/g, "Math.tan")
            .replace(/sqrt/g, "Math.sqrt")
            .replace(/log/g, "Math.log10");

          document.getElementById("result").textContent =
            "Result: " + eval(val);
        } catch {
          document.getElementById("result").textContent =
            "Invalid input";
        }
      }

      function clearCalc() {
        document.getElementById("calc").value = "";

        document.getElementById("result").textContent =
          "Waiting for input...";

        document.getElementById("calc").focus();
      }

      /* ENTER TO CALCULATE */

      document.getElementById("calc").addEventListener("keydown", (event) => {
        if (event.key === "Enter") {
          calculate();
        }
      });
    </script>
  </body>
</html>
