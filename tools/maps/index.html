<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>jasonyen.me</title>

    <link rel="icon" type="image/png" href="/images/favicon.png" />

    <style>
      /* ================= GLOBAL ================= */

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family:
          -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI",
          sans-serif;
      }

      html {
        min-height: 100%;
        background: #050816;
        scroll-behavior: smooth;
      }

      body {
        min-height: 100vh;
        position: relative;
        isolation: isolate;
        background: #050816;
        color: white;
        overflow-x: hidden;
      }

      /* ================= CONTINUOUS BACKGROUND ================= */

      body::before {
        content: "";
        position: fixed;
        inset: 0;
        z-index: -2;
        background:
          radial-gradient(
            circle at 0% 18%,
            rgba(127, 90, 240, 0.95),
            rgba(127, 90, 240, 0.55) 18%,
            transparent 38%
          ),
          radial-gradient(
            circle at 100% 82%,
            rgba(0, 194, 255, 0.55),
            transparent 36%
          ),
          linear-gradient(
            135deg,
            #050816 0%,
            #0b1022 50%,
            #0f172a 100%
          );
        background-repeat: no-repeat;
        background-size: cover;
      }

      /* ================= FLOATING ORBS ================= */

      .orb {
        position: fixed;
        width: 420px;
        height: 420px;
        border-radius: 50%;
        filter: blur(60px);
        opacity: 0.35;
        pointer-events: none;
        z-index: -1;
        animation: float 14s ease-in-out infinite alternate;
      }

      .orb1 {
        top: -120px;
        left: -120px;
        background: #7f5af0;
      }

      .orb2 {
        width: 380px;
        height: 380px;
        bottom: -120px;
        right: -120px;
        background: #00c2ff;
        animation-duration: 18s;
      }

      @keyframes float {
        0% {
          transform: translate(0, 0) scale(1);
        }

        50% {
          transform: translate(40px, 30px) scale(1.05);
        }

        100% {
          transform: translate(-20px, 50px) scale(0.98);
        }
      }

      /* ================= NAVBAR ================= */

      nav {
        width: 100%;
        padding: 24px 7%;
        display: flex;
        justify-content: space-between;
        align-items: center;
        position: fixed;
        top: 0;
        background: rgba(255, 255, 255, 0.05);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        z-index: 1000;
      }

      .logo {
        font-size: 1.5rem;
        font-weight: 700;
        letter-spacing: 1px;
        color: white;
        text-decoration: none;
      }

      .nav-links {
        display: flex;
        gap: 32px;
      }

      .nav-links a {
        text-decoration: none;
        color: rgba(255, 255, 255, 0.8);
        font-size: 0.95rem;
        transition: 0.3s;
      }

      .nav-links a:hover {
        color: white;
      }

      /* ================= MAIN GLASS CARD ================= */

      .chatbox {
        width: 90%;
        max-width: 1100px;
        margin: 120px auto 50px;
        padding: 60px;
        background: rgba(255, 255, 255, 0.08);
        backdrop-filter: blur(25px);
        -webkit-backdrop-filter: blur(25px);
        border-radius: 60px;
        border: 1px solid rgba(255, 255, 255, 0.12);
        box-shadow:
          0 8px 32px rgba(0, 0, 0, 0.35),
          inset 0 1px 1px rgba(255, 255, 255, 0.1);
        position: relative;
        z-index: 2;
      }

      /* ================= HEADING ================= */

      h1 {
        font-size: 1.7rem;
        font-weight: 600;
        margin-bottom: 10px;
        color: white;
      }

      .description {
        color: rgba(255, 255, 255, 0.7);
        font-size: 0.95rem;
        margin-bottom: 25px;
      }

      /* ================= BUTTON ================= */

      .game-link {
        padding: 16px 28px;
        border-radius: 18px;
        background: rgba(255, 255, 255, 0.08);
        border: 1px solid rgba(255, 255, 255, 0.1);
        color: white;
        font-weight: 600;
        cursor: pointer;
        transition: 0.35s;
        font-size: 0.95rem;
        display: inline-flex;
        align-items: center;
        justify-content: center;
      }

      .game-link:hover {
        transform: translateY(-4px) scale(1.04);
        background: rgba(255, 255, 255, 0.15);
        box-shadow: 0 15px 35px rgba(255, 255, 255, 0.12);
      }

      .game-link:active {
        transform: translateY(-1px) scale(1.01);
      }

      /* ================= LOCATION TEXT ================= */

      #locationText {
        margin-top: 20px;
        margin-bottom: 20px;
        padding: 14px 18px;
        min-height: 48px;
        display: flex;
        align-items: center;
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 18px;
        color: rgba(255, 255, 255, 0.8);
        font-size: 0.9rem;
        word-break: break-word;
      }

      /* ================= MAP ================= */

      .map-container {
        width: 100%;
        height: 500px;
        margin-top: 20px;
        border-radius: 30px;
        overflow: hidden;
        border: 1px solid rgba(255, 255, 255, 0.1);
        background: rgba(255, 255, 255, 0.04);
        box-shadow:
          0 8px 32px rgba(0, 0, 0, 0.3),
          inset 0 1px 1px rgba(255, 255, 255, 0.08);
      }

      .map-container iframe {
        width: 100%;
        height: 100%;
        border: 0;
        display: block;
      }

      /* ================= LOADER ================= */

      .loader {
        width: 16px;
        height: 16px;
        margin-left: 10px;
        border: 2px solid rgba(255, 255, 255, 0.3);
        border-top-color: white;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      /* ================= MOBILE ================= */

      @media (max-width: 768px) {
        nav {
          padding: 20px 5%;
        }

        .nav-links {
          display: none;
        }

        .chatbox {
          margin-top: 110px;
          padding: 30px;
          border-radius: 35px;
        }

        h1 {
          font-size: 1.5rem;
        }

        .game-link {
          width: 100%;
        }

        .map-container {
          height: 400px;
          border-radius: 24px;
        }
      }

      @media (max-width: 480px) {
        .chatbox {
          width: 94%;
          padding: 24px;
          border-radius: 30px;
        }

        h1 {
          font-size: 1.4rem;
        }

        .description {
          font-size: 0.9rem;
        }

        #locationText {
          font-size: 0.82rem;
        }

        .map-container {
          height: 350px;
          border-radius: 20px;
        }
      }
    </style>
  </head>

  <body>
    <!-- ================= BACKGROUND ORBS ================= -->

    <div class="orb orb1"></div>
    <div class="orb orb2"></div>

    <!-- ================= NAVBAR ================= -->

    <nav>
      <a href="/" class="logo">Map</a>

      <div class="nav-links">
        <a href="/">Main</a>
        <a href="/games">Games</a>
        <a href="/tools">Tools</a>
        <a href="/MP3 Shuffler">MP3 Shuffler</a>
      </div>
    </nav>

    <!-- ================= MAIN ================= -->

    <main class="chatbox">

      <p class="description">
        Detect your approximate location and display it on the map.
      </p>

      <button class="game-link" id="reloadBtn" onclick="loadMap()">
        Reset Location
        <span class="loader" id="loader" style="display: none"></span>
      </button>

      <div id="locationText"></div>

      <div class="map-container">
        <iframe
          id="mapFrame"
          src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3303.5798993484687!2d-117.8265!3d33.6846!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x80c34e4a34f61b3f%3A0x8b055d04f7cd622d!2sIrvine%2C%20CA!5e0!3m2!1sen!2sus!4v1626747158031!5m2!1sen!2sus"
          allowfullscreen
          loading="lazy"
          referrerpolicy="no-referrer-when-downgrade"
        ></iframe>
      </div>
    </main>

    <!-- ================= SCRIPT ================= -->

    <script>
      async function loadMap() {
        const loader = document.getElementById("loader");
        const locText = document.getElementById("locationText");
        const frame = document.getElementById("mapFrame");

        loader.style.display = "inline-block";
        locText.textContent = "Detecting location...";

        try {
          const res = await fetch("https://ipapi.co/json/");
          const data = await res.json();

          const lat = data.latitude;
          const lon = data.longitude;
          const ip = data.ip;

          frame.src =
            `https://www.google.com/maps?q=${lat},${lon}&z=12&output=embed`;

          locText.textContent =
            `📍 ${data.city}, ${data.country_name} | IP: ${ip}`;
        } catch {
          locText.textContent = "Location unavailable";
        } finally {
          loader.style.display = "none";
        }
      }

      loadMap();
    </script>
  </body>
</html>
