<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>jasonyen.me</title>
    <link rel="icon" type="image/png" href="/images/favicon.png" />

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family:
          -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI",
          sans-serif;
      }

      html {
        min-height: 100%;
        background: #050816;
        scroll-behavior: smooth;
      }

      body {
        min-height: 100vh;
        position: relative;
        isolation: isolate;
        background: #050816;
        color: white;
        overflow-x: hidden;
      }

      /* ================= BACKGROUND ================= */

      body::before {
        content: "";
        position: fixed;
        inset: 0;
        z-index: -2;
        background:
          radial-gradient(
            circle at 0% 18%,
            rgba(127, 90, 240, 0.95),
            rgba(127, 90, 240, 0.55) 18%,
            transparent 38%
          ),
          radial-gradient(
            circle at 100% 82%,
            rgba(0, 194, 255, 0.55),
            transparent 36%
          ),
          linear-gradient(
            135deg,
            #050816 0%,
            #0b1022 50%,
            #0f172a 100%
          );
        background-repeat: no-repeat;
        background-size: cover;
      }

      .orb {
        position: fixed;
        width: 420px;
        height: 420px;
        border-radius: 50%;
        filter: blur(60px);
        opacity: 0.35;
        pointer-events: none;
        z-index: -1;
        animation: float 14s ease-in-out infinite alternate;
      }

      .orb1 {
        top: -120px;
        left: -120px;
        background: #7f5af0;
      }

      .orb2 {
        width: 380px;
        height: 380px;
        bottom: -120px;
        right: -120px;
        background: #00c2ff;
        animation-duration: 18s;
      }

      @keyframes float {
        0% {
          transform: translate(0, 0) scale(1);
        }

        50% {
          transform: translate(40px, 30px) scale(1.05);
        }

        100% {
          transform: translate(-20px, 50px) scale(0.98);
        }
      }

      /* ================= NAVBAR ================= */

      nav {
        width: 100%;
        padding: 24px 7%;
        display: flex;
        justify-content: space-between;
        align-items: center;
        position: fixed;
        top: 0;
        background: rgba(255, 255, 255, 0.05);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        z-index: 1000;
      }

      .logo {
        font-size: 1.5rem;
        font-weight: 700;
        letter-spacing: 1px;
        color: white;
        text-decoration: none;
      }

      .nav-links {
        display: flex;
        gap: 32px;
      }

      .nav-links a {
        text-decoration: none;
        color: rgba(255, 255, 255, 0.8);
        font-size: 0.95rem;
        transition: 0.3s;
      }

      .nav-links a:hover {
        color: white;
      }

      /* ================= MAIN GLASS CARD ================= */

      .chatbox {
        width: 90%;
        max-width: 1100px;
        margin: 120px auto 50px;
        padding: 60px;
        background: rgba(255, 255, 255, 0.08);
        backdrop-filter: blur(25px);
        -webkit-backdrop-filter: blur(25px);
        border-radius: 60px;
        border: 1px solid rgba(255, 255, 255, 0.12);
        box-shadow:
          0 8px 32px rgba(0, 0, 0, 0.35),
          inset 0 1px 1px rgba(255, 255, 255, 0.1);
        position: relative;
        z-index: 2;
      }

      h1 {
        font-size: 1.7rem;
        font-weight: 600;
        margin-bottom: 10px;
        color: white;
      }

      .description {
        color: rgba(255, 255, 255, 0.7);
        font-size: 0.95rem;
        margin-bottom: 30px;
      }

      /* ================= WORD GENERATOR ================= */

      .word-generator {
        width: 100%;
        max-width: 720px;
        text-align: center;
      }

      .word-card {
        position: relative;
        width: 100%;
        padding: 40px 30px;
        margin-bottom: 28px;
        border-radius: 30px;
        background: rgba(255, 255, 255, 0.08);
        backdrop-filter: blur(24px);
        -webkit-backdrop-filter: blur(24px);
        border: 1px solid rgba(255, 255, 255, 0.12);
        box-shadow:
          0 20px 60px rgba(0, 0, 0, 0.25),
          inset 0 1px 0 rgba(255, 255, 255, 0.1);
        overflow: hidden;
        transition:
          transform 0.35s ease,
          box-shadow 0.35s ease;
      }

      .word-card:hover {
        transform: translateY(-4px);
        box-shadow:
          0 25px 70px rgba(0, 0, 0, 0.3),
          inset 0 1px 0 rgba(255, 255, 255, 0.12);
      }

      .word-card::before {
        content: "";
        position: absolute;
        inset: 0;
        background:
          radial-gradient(
            circle at 20% 0%,
            rgba(127, 90, 240, 0.2),
            transparent 45%
          ),
          radial-gradient(
            circle at 100% 100%,
            rgba(0, 194, 255, 0.12),
            transparent 40%
          );
        pointer-events: none;
      }

      /* ================= WORD ================= */

      #wordDisplay {
        position: relative;
        z-index: 1;
        width: 100%;
        border: none;
        outline: none;
        background: transparent;
        text-align: center;
        font-family:
          -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI",
          sans-serif;
        font-size: clamp(30px, 5vw, 52px);
        font-weight: 600;
        letter-spacing: -1px;
        color: white;
        margin-bottom: 18px;
        text-shadow: 0 6px 18px rgba(0, 0, 0, 0.25);
      }

      #wordDisplay::placeholder {
        color: rgba(255, 255, 255, 0.4);
      }

      /* ================= DEFINITION ================= */

      #meaningDisplay {
        position: relative;
        z-index: 1;
        font-size: 16px;
        line-height: 1.8;
        color: rgba(255, 255, 255, 0.78);
        max-width: 620px;
        margin: 0 auto;
      }

      /* ================= BUTTONS ================= */

      .button-row {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        justify-content: center;
      }

      .game-link {
        padding: 16px 28px;
        border-radius: 18px;
        background: rgba(255, 255, 255, 0.08);
        border: 1px solid rgba(255, 255, 255, 0.1);
        color: white;
        font-weight: 600;
        cursor: pointer;
        transition: 0.35s;
        font-size: 0.95rem;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-width: 140px;
      }

      .game-link:hover {
        transform: translateY(-4px) scale(1.04);
        background: rgba(255, 255, 255, 0.15);
        box-shadow: 0 15px 35px rgba(255, 255, 255, 0.12);
      }

      .game-link:active {
        transform: translateY(-1px) scale(1.01);
      }

      /* ================= FADE ================= */

      .fade-out {
        opacity: 0;
        transform: scale(0.96);
        transition:
          opacity 0.2s ease,
          transform 0.2s ease;
      }

      /* ================= MOBILE ================= */

      @media (max-width: 768px) {
        nav {
          padding: 20px 5%;
        }

        .nav-links {
          display: none;
        }

        .chatbox {
          margin-top: 110px;
          padding: 30px;
          border-radius: 35px;
        }

        h1 {
          font-size: 1.5rem;
        }

        .button-row {
          flex-direction: column;
        }

        .game-link {
          width: 100%;
        }
      }

      @media (max-width: 480px) {
        .chatbox {
          width: 94%;
          padding: 24px;
          border-radius: 30px;
        }

        h1 {
          font-size: 1.4rem;
        }

        .description {
          font-size: 0.9rem;
        }

        .word-card {
          padding: 28px 20px;
          border-radius: 24px;
        }

        #wordDisplay {
          font-size: 32px;
        }

        #meaningDisplay {
          font-size: 15px;
          line-height: 1.7;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
        }
      }
    </style>
  </head>

  <body>
    <div class="orb orb1"></div>
    <div class="orb orb2"></div>

    <nav>
      <a href="/" class="logo">Word Generator</a>

      <div class="nav-links">
        <a href="/">Main</a>
        <a href="/games">Games</a>
        <a href="/tools">Tools</a>
        <a href="/MP3 Shuffler">MP3 Shuffler</a>
      </div>
    </nav>

    <main class="chatbox">

      <p class="description">
        Discover an advanced word, learn its meaning, hear its pronunciation,
        or copy it.
      </p>

      <div class="word-generator">
        <div class="word-card">
          <input
            id="wordDisplay"
            disabled
            placeholder="Word will appear here"
          />

          <div id="meaningDisplay">
            Press generate.
          </div>
        </div>

        <div class="button-row">
          <button class="game-link" id="generateBtn">
            Generate
          </button>

          <button class="game-link" id="speakBtn">
            🔊 Speak
          </button>

          <button class="game-link" id="copyBtn">
            📋 Copy
          </button>
        </div>
      </div>
    </main>

<script>
  const wordDisplay = document.getElementById("wordDisplay");
  const meaningDisplay = document.getElementById("meaningDisplay");
  const generateBtn = document.getElementById("generateBtn");
  const speakBtn = document.getElementById("speakBtn");
  const copyBtn = document.getElementById("copyBtn");

  const wordsList = [
    "aberration",
    "abstruse",
    "accolade",
    "acrimony",
    "adulation",
    "alacrity",
    "anachronism",
    "antithesis",
    "archetype",
    "ardent",
    "assiduous",
    "belligerent",
    "benevolent",
    "catharsis",
    "cacophony",
    "chicanery",
    "circumspect",
    "conflagration",
    "conundrum",
    "copious",
    "cursory",
    "dearth",
    "deleterious",
    "demagogue",
    "didactic",
    "dichotomy",
    "disparate",
    "divergent",
    "ebullient",
    "effervescent",
    "egregious",
    "enervate",
    "equivocate",
    "esoteric",
    "evanescent",
    "exacerbate",
    "fastidious",
    "fatuous",
    "flippant",
    "fortuitous",
    "garrulous",
    "grandiloquent",
    "hapless",
    "harangue",
    "iconoclast",
    "idiosyncrasy",
    "impetuous",
    "inimical",
    "insidious",
    "insipid",
    "intrepid",
    "inundate",
    "laconic",
    "lethargic",
    "lugubrious",
    "magnanimous",
    "mendacious",
    "munificent",
    "nefarious",
    "obsequious",
    "parsimonious",
    "pedantic",
    "perfunctory",
    "phlegmatic"
  ];

  const definitions = {
    aberration:
      "A departure from what is normal, expected, or typical.",

    abstruse:
      "Difficult to understand because of complexity or obscurity.",

    accolade:
      "An award or expression of praise or approval.",

    acrimony:
      "Sharpness or bitterness in speech, manner, or feeling.",

    adulation:
      "Excessive praise or admiration.",

    alacrity:
      "Cheerful readiness or eagerness.",

    anachronism:
      "Something belonging to a different period of history.",

    antithesis:
      "The direct opposite or contrast of something.",

    archetype:
      "A typical example or original model of something.",

    ardent:
      "Very enthusiastic, passionate, or devoted.",

    assiduous:
      "Showing great care, attention, and persistence.",

    belligerent:
      "Hostile and aggressive.",

    benevolent:
      "Well-meaning and kindly.",

    catharsis:
      "The release of strong or suppressed emotions.",

    cacophony:
      "A harsh or unpleasant mixture of sounds.",

    chicanery:
      "The use of trickery or deception to achieve a purpose.",

    circumspect:
      "Careful to consider all circumstances and consequences.",

    conflagration:
      "A large and destructive fire.",

    conundrum:
      "A confusing or difficult problem or question.",

    copious:
      "Abundant or plentiful.",

    cursory:
      "Done quickly without paying close attention to detail.",

    dearth:
      "A lack or shortage of something.",

    deleterious:
      "Causing harm or damage.",

    demagogue:
      "A political leader who gains support by appealing to emotions and prejudices.",

    didactic:
      "Intended to teach or instruct.",

    dichotomy:
      "A division or contrast between two things.",

    disparate:
      "Essentially different or unrelated.",

    divergent:
      "Moving or developing in different directions.",

    ebullient:
      "Cheerful, enthusiastic, and full of energy.",

    effervescent:
      "Lively, enthusiastic, or bubbly.",

    egregious:
      "Outstandingly bad or shocking.",

    enervate:
      "To weaken or drain energy from someone or something.",

    equivocate:
      "To speak ambiguously in order to avoid committing to a position.",

    esoteric:
      "Intended for or understood by only a small group with specialized knowledge.",

    evanescent:
      "Soon disappearing or fading away.",

    exacerbate:
      "To make a problem or situation worse.",

    fastidious:
      "Very attentive to detail and accuracy.",

    fatuous:
      "Silly or foolish, especially in a self-satisfied way.",

    flippant:
      "Not showing a serious or respectful attitude.",

    fortuitous:
      "Happening by chance, often in a fortunate way.",

    garrulous:
      "Excessively talkative.",

    grandiloquent:
      "Using language that is elaborate or intended to sound impressive.",

    hapless:
      "Unfortunate or unlucky.",

    harangue:
      "A long and forceful speech or verbal attack.",

    iconoclast:
      "A person who challenges established beliefs or traditions.",

    idiosyncrasy:
      "A distinctive or unusual characteristic.",

    impetuous:
      "Acting quickly without thinking carefully about the consequences.",

    inimical:
      "Hostile or harmful.",

    insidious:
      "Proceeding gradually and subtly while causing harm.",

    insipid:
      "Lacking flavor, interest, or excitement.",

    intrepid:
      "Fearless and adventurous.",

    inundate:
      "To overwhelm with a large amount of something.",

    laconic:
      "Using very few words.",

    lethargic:
      "Lacking energy or enthusiasm.",

    lugubrious:
      "Looking or sounding sad and gloomy.",

    magnanimous:
      "Generous and forgiving, especially toward a rival.",

    mendacious:
      "Not telling the truth; dishonest.",

    munificent:
      "Very generous, especially with money or gifts.",

    nefarious:
      "Wicked or criminal.",

    obsequious:
      "Excessively eager to please or obey someone.",

    parsimonious:
      "Extremely unwilling to spend or use resources.",

    pedantic:
      "Overly concerned with minor details or rules.",

    perfunctory:
      "Done with little effort, interest, or enthusiasm.",

    phlegmatic:
      "Calm and unemotional, especially in difficult situations."
  };

  let recentWords = [];

  function generateWord() {
    wordDisplay.classList.add("fade-out");

    setTimeout(() => {
      let availableWords = wordsList.filter(
        (word) => !recentWords.includes(word)
      );

      if (availableWords.length === 0) {
        recentWords = [];
        availableWords = [...wordsList];
      }

      const word =
        availableWords[
          Math.floor(Math.random() * availableWords.length)
        ];

      recentWords.push(word);

      if (recentWords.length > 4) {
        recentWords.shift();
      }

      wordDisplay.value = word;

      meaningDisplay.textContent =
        definitions[word] || "Definition not available.";

      wordDisplay.classList.remove("fade-out");
    }, 200);
  }

  function speakWord() {
    if (!wordDisplay.value) return;

    if (!("speechSynthesis" in window)) {
      speakBtn.textContent = "Not supported";

      setTimeout(() => {
        speakBtn.textContent = "🔊 Speak";
      }, 2000);

      return;
    }

    speechSynthesis.cancel();

    speakBtn.textContent = "Speaking...";

    const utterance = new SpeechSynthesisUtterance(
      wordDisplay.value
    );

    utterance.rate = 0.85;
    utterance.pitch = 1;

    utterance.onend = () => {
      speakBtn.textContent = "🔊 Speak";
    };

    utterance.onerror = () => {
      speakBtn.textContent = "🔊 Speak";
    };

    speechSynthesis.speak(utterance);
  }

  async function copyWord() {
    if (!wordDisplay.value) return;

    try {
      await navigator.clipboard.writeText(wordDisplay.value);

      const originalText = copyBtn.textContent;

      copyBtn.textContent = "Copied!";

      setTimeout(() => {
        copyBtn.textContent = originalText;
      }, 2000);
    } catch {
      const textArea = document.createElement("textarea");

      textArea.value = wordDisplay.value;
      textArea.style.position = "fixed";
      textArea.style.opacity = "0";

      document.body.appendChild(textArea);

      textArea.select();

      try {
        document.execCommand("copy");

        copyBtn.textContent = "Copied!";

        setTimeout(() => {
          copyBtn.textContent = "📋 Copy";
        }, 2000);
      } catch {
        copyBtn.textContent = "Copy failed";

        setTimeout(() => {
          copyBtn.textContent = "📋 Copy";
        }, 2000);
      }

      document.body.removeChild(textArea);
    }
  }

  generateBtn.addEventListener("click", generateWord);
  speakBtn.addEventListener("click", speakWord);
  copyBtn.addEventListener("click", copyWord);
</script>
  </body>
</html>
