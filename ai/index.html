<style>
* {
  margin:0;
  padding:0;
  box-sizing:border-box;

    -apple-system,

    "SF Pro Display",

html {

  background:#050816;
}


body {
  min-height:100vh;

/* ================= ORBS ================= */

.orb {

 position:fixed;
 border-radius:50%;
 filter:blur(60px);
 opacity:.35;
 pointer-events:none;
 animation:float 14s ease-in-out infinite alternate;

}


.orb1 {

 width:420px;
 height:420px;
 top:-120px;
 left:-120px;
 background:#7f5af0;

}


.orb2 {

 width:380px;
 height:380px;
 bottom:-120px;
 right:-120px;
 background:#00c2ff;
 animation-duration:18s;

}


@keyframes float {

0% {
 transform:translate(0,0) scale(1);
}

50% {
 transform:translate(60px,-40px) scale(1.15);
}

100% {
 transform:translate(-40px,50px) scale(.95);
}

}



/* ================= NAVBAR ================= */

width:100%;
padding:24px 7%;

display:flex;
justify-content:space-between;
align-items:center;

position:fixed;
top:0;

background:rgba(255,255,255,.05);
backdrop-filter:blur(20px);

border-bottom:
1px solid rgba(255,255,255,.08);

z-index:1000;

}



.logo {

font-size:1.5rem;
font-weight:700;
letter-spacing:1px;

}



.nav-links {

display:flex;
gap:32px;

}



.nav-links a {

text-decoration:none;
color:rgba(255,255,255,.8);

font-size:.95rem;

transition:.3s;

}

color:white;

}




/* ================= CHAT CARD ================= */


.chatbox {

width:90%;
max-width:1100px;

margin:150px auto 50px;

padding:60px;


background:rgba(255,255,255,.08);

backdrop-filter:blur(25px);
-webkit-backdrop-filter:blur(25px);

border-radius:60px;

border:
1px solid rgba(255,255,255,.12);


box-shadow:

0 8px 32px rgba(0,0,0,.35),

inset 0 1px 1px rgba(255,255,255,.1);

}




/* ================= CHAT ================= */


#chat-log {

list-style:none;

max-height:500px;

overflow-y:auto;

}



#chat-log li {

padding:20px;

margin-bottom:15px;

border-radius:25px;

white-space:pre-wrap;

line-height:1.7;

}



.bot-msg {

background:rgba(255,255,255,.08);

border:1px solid rgba(255,255,255,.1);

}



.user-msg {

background:#7f5af0;

}




/* ================= INPUT ================= */


.chat-input-area {

display:flex;

gap:15px;

margin-top:30px;

}



input {

flex:1;

padding:18px 22px;

border-radius:18px;

border:

1px solid rgba(255,255,255,.15);


background:rgba(255,255,255,.08);

color:white;

font-size:1rem;

outline:none;

}



input::placeholder {

color:rgba(255,255,255,.5);

}




/* ================= BUTTON ================= */


.game-link {

padding:16px 28px;

border-radius:18px;

text-decoration:none;

font-weight:600;

cursor:pointer;


background:rgba(255,255,255,.08);

border:

1px solid rgba(255,255,255,.1);


color:white;


transition:.35s;

}



.game-link:hover {

transform:translateY(-4px);

background:rgba(255,255,255,.15);

box-shadow:
0 15px 35px rgba(255,255,255,.12);

}

.nav-links {

display:none;

}


.chatbox {

padding:30px;

border-radius:35px;

}



.chat-input-area {

flex-direction:column;

}

}

  <body>


      <div class="chatbox">
        <ul id="chat-log">
          <li class="bot-msg">Type a word...</li>
        </ul>

        <div class="chat-input-area">
          <input type="text" id="user-input" placeholder="Type your word..." />

          <button class="game-link" id="ask-btn">Enter</button>

          <a
            class="game-link"
            id="full-article-btn"
            href="#"
            style="display: none"
          >
            Full Article
          </a>
        </div>
      </div>
    </div>

    <nav>
      <div class="logo">Definition Finder</div>

      <div class="nav-links">
        <a href="">Main</a>
        <a href="games">Games</a>
        <a href="tools">Tools</a>
        <a href="donatejk">Donate</a>
        <a href="radio">Radio</a>
      </div>

    <!-- ================= FX ================= -->

    <script>
      /* ================= DARK MODE ================= */
      const toggle = document.getElementById("toggle");

      const icon = document.getElementById("icon");

      if (localStorage.getItem("darkMode") === "on") {
        document.body.classList.add("dark");

        toggle.classList.add("active");

        icon.textContent = "☀️";
      }

      toggle.onclick = () => {
        const isDark = document.body.classList.toggle("dark");

        toggle.classList.toggle("active");

        icon.textContent = isDark ? "☀️" : "🌙";

        localStorage.setItem("darkMode", isDark ? "on" : "off");
      };

      /* ================= CURSOR GLOW ================= */
      const glow = document.querySelector(".cursor-glow");

      document.addEventListener("mousemove", (e) => {
        glow.style.left = e.clientX + "px";

        glow.style.top = e.clientY + "px";
      });

      /* ================= ELEMENTS ================= */
      const askBtn = document.getElementById("ask-btn");

      const userInput = document.getElementById("user-input");

      const chatLog = document.getElementById("chat-log");

      const fullArticleBtn = document.getElementById("full-article-btn");

      const suggestionsBox = document.getElementById("suggestions");

      /* ================= AI STYLE ================= */
      function generateAnswer(query, text) {
        return "Answer:\n\n" + text;
      }

      async function search(query) {
        let parts = [];

        /* ================= EXPLAIN MODE ================= */
        const explainMode =
          /explain|elaborate|detail|in depth|tell me more|how does/i.test(
            query,
          );

        const cleanQuery = query
          .replace(
            /explain|elaborate|in detail|tell me more about|how does/gi,
            "",
          )
          .trim();

        /* ================= WIKIPEDIA ================= */
        try {
          const wikiRes = await fetch(
            `https://en.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(cleanQuery)}`,
          );

          const wikiData = await wikiRes.json();

          const badWiki =
            !wikiData.extract ||
            wikiData.extract.includes("may refer to") ||
            wikiData.extract.length < 40;

          if (!badWiki) {
            parts.push(wikiData.extract);

            fullArticleBtn.href = wikiData.content_urls.desktop.page;

            fullArticleBtn.style.display = "inline-flex";
          }
        } catch {}

        /* ================= DUCKDUCKGO ================= */
        try {
          const ddgRes = await fetch(
            `https://api.duckduckgo.com/?q=${encodeURIComponent(cleanQuery)}&format=json&no_redirect=1`,
          );

          const ddgData = await ddgRes.json();

          if (ddgData.AbstractText) {
            parts.push(ddgData.AbstractText);
          } else if (ddgData.RelatedTopics?.length) {
            parts.push(ddgData.RelatedTopics[0].Text);
          }
        } catch {}

        /* ================= EXTRA DETAIL ================= */
        if (explainMode) {
          try {
            const extraRes = await fetch(
              `https://api.duckduckgo.com/?q=${encodeURIComponent(cleanQuery + " detailed explanation how it works")}&format=json&no_redirect=1`,
            );

            const extraData = await extraRes.json();

            if (extraData.AbstractText) {
              parts.push(extraData.AbstractText);
            } else if (extraData.RelatedTopics?.length) {
              parts.push(extraData.RelatedTopics[0].Text);
            }
          } catch {}
        }

        /* ================= WIKIDATA ================= */
        if (explainMode) {
          try {
            const sparql = `
            SELECT ?item ?itemLabel ?desc WHERE {
              ?item rdfs:label "${cleanQuery}"@en.
              ?item schema:description ?desc.
              FILTER (lang(?desc) = "en")
              SERVICE wikibase:label { bd:serviceParam wikibase:language "en". }
            }
            LIMIT 1`;

            const wdRes = await fetch(
              "https://query.wikidata.org/sparql?query=" +
                encodeURIComponent(sparql),
              {
                headers: {
                  Accept: "application/sparql-results+json",
                },
              },
            );

            const wdData = await wdRes.json();

            const desc = wdData?.results?.bindings?.[0]?.desc?.value;

            if (desc) {
              parts.push(desc);
            }
          } catch (e) {}
        }

        /* ================= DEEP SEARCH ================= */
        if (explainMode) {
          try {
            const deepRes = await fetch(
              `https://api.duckduckgo.com/?q=${encodeURIComponent(cleanQuery + " examples uses importance")}&format=json&no_redirect=1`,
            );

            const deepData = await deepRes.json();

            if (deepData.AbstractText) {
              parts.push(deepData.AbstractText);
            } else if (deepData.RelatedTopics?.length) {
              parts.push(deepData.RelatedTopics[0].Text);
            }
          } catch {}
        }

        /* ================= SMART DEDUPE ================= */
        function isSimilar(a, b) {
          a = a.toLowerCase();

          b = b.toLowerCase();

          return a.includes(b.slice(0, 60)) || b.includes(a.slice(0, 60));
        }

        function smartDeduplicate(arr) {
          const result = [];

          for (let i = 0; i < arr.length; i++) {
            let duplicate = false;

            for (let j = 0; j < result.length; j++) {
              if (isSimilar(arr[i], result[j])) {
                duplicate = true;

                break;
              }
            }

            if (!duplicate) {
              result.push(arr[i]);
            }
          }

          return result;
        }

        if (parts.length > 0) {
          const unique = smartDeduplicate(parts);

          return (
            (explainMode ? "Detailed Explanation:\n\n" : "Answer:\n\n") +
            unique.join("\n\n")
          );
        }

        /* ================= FALLBACK ================= */
        fullArticleBtn.style.display = "none";

        return `Answer:\n\nI couldn’t find a strong explanation for "${query}". Try being more specific.`;
      }

      /* ================= ASK ================= */
      askBtn.onclick = async () => {
        const query = userInput.value.trim();

        if (!query) return;

        if (suggestionsBox) {
          suggestionsBox.style.display = "none";
        }

        const li = document.createElement("li");

        li.className = "user-msg";

        li.textContent = query;

        chatLog.appendChild(li);

        const botLi = document.createElement("li");

        botLi.className = "bot-msg";

        botLi.textContent = "Thinking...";

        chatLog.appendChild(botLi);

        chatLog.scrollTop = chatLog.scrollHeight;

        const answer = await search(query);

        botLi.textContent = answer;

        userInput.value = "";
      };

      /* ================= AUTOCOMPLETE ================= */
      let debounceTimer;

      userInput.addEventListener("input", () => {
        if (!suggestionsBox) return;

        clearTimeout(debounceTimer);

        const query = userInput.value.trim();

        if (query.length < 2) {
          suggestionsBox.style.display = "none";

          return;
        }

        debounceTimer = setTimeout(async () => {
          try {
            const res = await fetch(`https://api.datamuse.com/sug?s=${query}`);

            const data = await res.json();

            suggestionsBox.innerHTML = "";

            data.slice(0, 5).forEach((item) => {
              const div = document.createElement("div");

              div.className = "suggestion";

              div.textContent = item.word;

              div.onclick = () => {
                userInput.value = item.word;

                suggestionsBox.style.display = "none";

                askBtn.click();
              };

              suggestionsBox.appendChild(div);
            });

            suggestionsBox.style.display = "block";
          } catch {
            suggestionsBox.style.display = "none";
          }
        }, 300);
      });

      /* ================= HIDE SUGGESTIONS ================= */
      document.addEventListener("click", (e) => {
        if (!e.target.closest(".chat-input-area")) {
          if (suggestionsBox) {
            suggestionsBox.style.display = "none";
          }
        }
      });

      const cursor = document.querySelector(".cursor");

document.addEventListener("mousemove", (e) => {
  cursor.style.left = e.clientX + "px";
  cursor.style.top = e.clientY + "px";
});
    </script>

  </body>
