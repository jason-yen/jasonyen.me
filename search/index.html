<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>jasonyen.me</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Spectral:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="icon" type="image/png" href="/images/favicon.png" />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family:
          -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI",
          sans-serif;
      }
      html {
        min-height: 100%;
        background: #050816;
        scroll-behavior: smooth;
      }

      body {
        min-height: 100vh;
        position: relative;
        isolation: isolate;
        background: #050816;
        color: white;
        overflow-x: hidden;
      }

      /* CONTINUOUS BACKGROUND GRADIENT */
      body::before {
        content: "";
        position: fixed;
        inset: 0;
        z-index: -2;
        pointer-events: none;
        background:
          radial-gradient(
            circle at 0% 18%,
            rgba(127, 90, 240, 0.95) 0%,
            rgba(127, 90, 240, 0.55) 16%,
            transparent 38%
          ),
          radial-gradient(
            circle at 100% 82%,
            rgba(0, 194, 255, 0.55) 0%,
            transparent 36%
          ),
          linear-gradient(135deg, #050816 0%, #0b1022 48%, #0f172a 100%);
        background-repeat: no-repeat;
        background-size: cover;
      }

      /* ORBS */
      .orb {
        position: fixed;
        border-radius: 50%;
        filter: blur(60px);
        opacity: 0.35;
        pointer-events: none;
        animation: float 14s ease-in-out infinite alternate;
      }
      .orb1 {
        width: 420px;
        height: 420px;
        top: -120px;
        left: -120px;
        background: #7f5af0;
      }
      .orb2 {
        width: 380px;
        height: 380px;
        bottom: -120px;
        right: -120px;
        background: #00c2ff;
        animation-duration: 18s;
      }
      @keyframes float {
        0% {
          transform: translate(0, 0) scale(1);
        }
        50% {
          transform: translate(60px, -40px) scale(1.15);
        }
        100% {
          transform: translate(-40px, 50px) scale(0.95);
        }
      } /* NAVBAR */
      nav {
        width: 100%;
        padding: 24px 7%;
        display: flex;
        justify-content: space-between;
        align-items: center;
        position: fixed;
        top: 0;
        background: rgba(255, 255, 255, 0.05);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        z-index: 1000;
      }
      .logo {
        font-size: 1.5rem;
        font-weight: 700;
        letter-spacing: 1px;
      }
      .nav-links {
        display: flex;
        gap: 32px;
      }
      .nav-links a {
        text-decoration: none;
        color: rgba(255, 255, 255, 0.8);
        font-size: 0.95rem;
        transition: 0.3s;
      }
      .nav-links a:hover {
        color: white;
      } /* CHAT CARD */
      .chatbox {
        width: 90%;
        max-width: 1100px;
        margin: 120px auto 50px;

        padding: 60px;
        background: rgba(255, 255, 255, 0.08);
        backdrop-filter: blur(25px);
        -webkit-backdrop-filter: blur(25px);
        border-radius: 60px;
        border: 1px solid rgba(255, 255, 255, 0.12);
        box-shadow:
          0 8px 32px rgba(0, 0, 0, 0.35),
          inset 0 1px 1px rgba(255, 255, 255, 0.1);
        position: relative;
        z-index: 2;
      } /* CHAT */
      #chat-log {
        list-style: none;
        max-height: 500px;
        overflow-y: auto;
      }
      #chat-log li {
        padding: 20px;
        margin-bottom: 15px;
        border-radius: 25px;
        white-space: pre-wrap;
        line-height: 1.7;
      }

      .bot-msg {
        background: rgba(255, 255, 255, 0.08);
        border: 1px solid rgba(255, 255, 255, 0.1);
      }

      #chat-log li:first-child {
        margin-top: 0;
      }
      .user-msg {
        background: #7f5af0;
      } /* INPUT */
      .chat-input-area {
        display: flex;
        gap: 15px;
        margin-top: 30px;
      }
      input {
        flex: 1;
        padding: 18px 22px;
        border-radius: 18px;
        border: 1px solid rgba(255, 255, 255, 0.15);
        background: rgba(255, 255, 255, 0.08);
        color: white;
        font-size: 1rem;
        outline: none;
      }
      input:focus {
        border-color: rgba(127, 90, 240, 0.7);
        box-shadow: 0 0 20px rgba(127, 90, 240, 0.2);
      }
      input::placeholder {
        color: rgba(255, 255, 255, 0.5);
      } /* BUTTONS */
      .game-link {
        padding: 16px 28px;
        border-radius: 18px;
        text-decoration: none;
        font-weight: 600;
        cursor: pointer;
        background: rgba(255, 255, 255, 0.08);
        border: 1px solid rgba(255, 255, 255, 0.1);
        color: white;
        transition: 0.35s;
      }
      .game-link:hover {
        transform: translateY(-4px) scale(1.04);
        background: rgba(255, 255, 255, 0.15);
        box-shadow: 0 15px 35px rgba(255, 255, 255, 0.12);
      } /* AUTOCOMPLETE */
      .chat-input-area {
        position: relative;
      }
      .suggestions {
        position: absolute;
        left: 0;
        right: 140px;
        top: calc(100% + 10px);
        background: rgba(15, 23, 42, 0.9);
        backdrop-filter: blur(20px);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 18px;
        overflow: hidden;
        z-index: 10;
      }
      .suggestion {
        padding: 14px 18px;
        cursor: pointer;
        color: rgba(255, 255, 255, 0.8);
      }
      .suggestion:hover {
        background: rgba(255, 255, 255, 0.1);
        color: white;
      } /* MOBILE */
      @media (max-width: 768px) {
        nav {
          padding: 20px 5%;
        }
        .nav-links {
          display: none;
        }
        .chatbox {
          margin-top: 110px;
          padding: 30px;
          border-radius: 35px;
        }
        .chat-input-area {
          flex-direction: column;
        }
        .suggestions {
          right: 0;
        }
      }
    </style>
  </head>
  <body>
    <div class="orb orb1"></div>
    <div class="orb orb2"></div>
    <nav>
      <div class="logo">Search Engine
      </div>
      <div class="nav-links">
        <a href="/">Main</a>
    <a href="/games">Games</a>
        <a href="/tools">Tools</a>
        <a href="/shuffler">shuffler</a>
      </div>
    </nav>
    <div class="chatbox">
      <ul id="chat-log">
        <li class="bot-msg">Type a word...</li>
      </ul>
      <div class="chat-input-area">
        <input type="text" id="user-input" placeholder="Type your word..." />

        <button class="game-link" id="ask-btn">Enter</button>

        <a
          class="game-link"
          id="full-article-btn"
          href="#"
          style="display: none"
        >
          Full Article
        </a>

        <div class="suggestions" id="suggestions" style="display: none"></div>
      </div>
    </div>
    <script>
      const askBtn = document.getElementById("ask-btn");
      const userInput = document.getElementById("user-input");
      const chatLog = document.getElementById("chat-log");
      const fullArticleBtn = document.getElementById("full-article-btn");
      const suggestionsBox = document.getElementById("suggestions");
      async function search(query) {
        let parts = [];
        const explainMode =
          /explain|elaborate|detail|in depth|tell me more|how does/i.test(
            query,
          );
        const cleanQuery = query
          .replace(
            /explain|elaborate|in detail|tell me more about|how does/gi,
            "",
          )
          .trim();
        try {
          const wikiRes = await fetch(
            `https://en.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(cleanQuery)}`,
          );
          const wikiData = await wikiRes.json();
          const badWiki =
            !wikiData.extract ||
            wikiData.extract.includes("may refer to") ||
            wikiData.extract.length < 40;
          if (!badWiki) {
            parts.push(wikiData.extract);
            fullArticleBtn.href = wikiData.content_urls.desktop.page;
            fullArticleBtn.style.display = "inline-flex";
          }
        } catch {}
        try {
          const ddgRes = await fetch(
            `https://api.duckduckgo.com/?q=${encodeURIComponent(cleanQuery)}&format=json&no_redirect=1`,
          );
          const ddgData = await ddgRes.json();
          if (ddgData.AbstractText) {
            parts.push(ddgData.AbstractText);
          } else if (ddgData.RelatedTopics?.length) {
            parts.push(ddgData.RelatedTopics[0].Text);
          }
        } catch {}
        if (explainMode) {
          try {
            const extraRes = await fetch(
              `https://api.duckduckgo.com/?q=${encodeURIComponent(cleanQuery + " detailed explanation how it works")}&format=json&no_redirect=1`,
            );
            const extraData = await extraRes.json();
            if (extraData.AbstractText) {
              parts.push(extraData.AbstractText);
            } else if (extraData.RelatedTopics?.length) {
              parts.push(extraData.RelatedTopics[0].Text);
            }
          } catch {}
          try {
            const sparql = ` SELECT ?item ?itemLabel ?desc WHERE { ?item rdfs:label "${cleanQuery}"@en. ?item schema:description ?desc. FILTER (lang(?desc) = "en") SERVICE wikibase:label { bd:serviceParam wikibase:language "en". } } LIMIT 1 `;
            const wdRes = await fetch(
              "https://query.wikidata.org/sparql?query=" +
                encodeURIComponent(sparql),
              { headers: { Accept: "application/sparql-results+json" } },
            );
            const wdData = await wdRes.json();
            const desc = wdData?.results?.bindings?.[0]?.desc?.value;
            if (desc) {
              parts.push(desc);
            }
          } catch {}
          try {
            const deepRes = await fetch(
              `https://api.duckduckgo.com/?q=${encodeURIComponent(cleanQuery + " examples uses importance")}&format=json&no_redirect=1`,
            );
            const deepData = await deepRes.json();
            if (deepData.AbstractText) {
              parts.push(deepData.AbstractText);
            } else if (deepData.RelatedTopics?.length) {
              parts.push(deepData.RelatedTopics[0].Text);
            }
          } catch {}
        }
        function isSimilar(a, b) {
          a = a.toLowerCase();
          b = b.toLowerCase();
          return a.includes(b.slice(0, 60)) || b.includes(a.slice(0, 60));
        }
        function smartDeduplicate(arr) {
          const result = [];
          for (const item of arr) {
            let duplicate = false;
            for (const existing of result) {
              if (isSimilar(item, existing)) {
                duplicate = true;
                break;
              }
            }
            if (!duplicate) {
              result.push(item);
            }
          }
          return result;
        }
        if (parts.length) {
          const unique = smartDeduplicate(parts);
          return (
            (explainMode ? "Detailed Explanation:\n\n" : "Answer:\n\n") +
            unique.join("\n\n")
          );
        }
        fullArticleBtn.style.display = "none";
        return `Answer:\n\nI couldn’t find a strong explanation for "${query}". Try being more specific.`;
      }
      askBtn.onclick = async () => {
        const query = userInput.value.trim();
        if (!query) return;
        suggestionsBox.style.display = "none";
        const userMessage = document.createElement("li");
        userMessage.className = "user-msg";
        userMessage.textContent = query;
        chatLog.appendChild(userMessage);
        const botMessage = document.createElement("li");
        botMessage.className = "bot-msg";
        botMessage.textContent = "Thinking...";
        chatLog.appendChild(botMessage);
        chatLog.scrollTop = chatLog.scrollHeight;
        const answer = await search(query);
        botMessage.textContent = answer;
        userInput.value = "";
        chatLog.scrollTop = chatLog.scrollHeight;
      };
      userInput.addEventListener("keydown", (e) => {
        if (e.key === "Enter") {
          askBtn.click();
        }
      });
      let debounceTimer;
      userInput.addEventListener("input", () => {
        clearTimeout(debounceTimer);
        const query = userInput.value.trim();
        if (query.length < 2) {
          suggestionsBox.style.display = "none";
          return;
        }
        debounceTimer = setTimeout(async () => {
          try {
            const res = await fetch(
              `https://api.datamuse.com/sug?s=${encodeURIComponent(query)}`,
            );
            const data = await res.json();
            suggestionsBox.innerHTML = "";
            data.slice(0, 5).forEach((item) => {
              const div = document.createElement("div");
              div.className = "suggestion";
              div.textContent = item.word;
              div.onclick = () => {
                userInput.value = item.word;
                suggestionsBox.style.display = "none";
                askBtn.click();
              };
              suggestionsBox.appendChild(div);
            });
            suggestionsBox.style.display = data.length ? "block" : "none";
          } catch {
            suggestionsBox.style.display = "none";
          }
        }, 300);
      });
      document.addEventListener("click", (e) => {
        if (!e.target.closest(".chat-input-area")) {
          suggestionsBox.style.display = "none";
        }
      });
    </script>
  </body>
</html>
